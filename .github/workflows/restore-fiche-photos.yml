name: Restaurer les photos originales des fiches
on:
  push:
    branches: [main]
    paths: [tools/restore-fiche-photos-manifest.json]
permissions:
  contents: write
concurrency:
  group: restore-fiche-photos
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les bibliothèques d’images et HTML
        run: python -m pip install Pillow==12.3.0 lxml==6.1.3
      - name: Récupérer toutes les photos publiques et vérifier les fiches
        run: python tools/restore-fiche-photos.py
      - name: Enregistrer les fiches et les photos vérifiées
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets vivreanyons-test banniere-nyons Auvergne-Rhone-Alpes Histoire-Geo Provence-Alpes-Cote-dAzur a-faire-autour-de-Nyons evenements-nyons infos-pratiques-nyons ou-dormir-a-nyons produits-du-terroir que-faire-autour-de-nyons que-faire-nyons randonnee-nyons restaurants-de-nyons
          git commit -m 'Restore 251 missing fiche photos with descriptive alt text'
          git push origin HEAD:main
