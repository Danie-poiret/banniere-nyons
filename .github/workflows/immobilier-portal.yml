name: Actualiser uniquement les cartes du portail immobilier
on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - sitemap.xml
      - tools/update_immobilier_portal.py
      - tools/immobilier-portal.json
      - tools/harmonize_seo.py
      - tools/publish_generated_pages.py
      - .github/workflows/immobilier-portal.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vivreanyons-immobilier-portal
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'push' || !(contains(github.event.head_commit.message, 'Memory-Cities-Only: true') || contains(github.event.head_commit.message, 'Footer-Memory-Link-Only: true') || contains(github.event.head_commit.message, 'Markets-Guide-Only: true'))) && (github.event_name != 'workflow_run' || !(contains(github.event.workflow_run.head_commit.message, 'Memory-Cities-Only: true') || contains(github.event.workflow_run.head_commit.message, 'Footer-Memory-Link-Only: true') || contains(github.event.workflow_run.head_commit.message, 'Markets-Guide-Only: true'))) && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Autour-Portal-Only: true')) && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Hikes-Guide-Only: true')) && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Nyons-Guide-Only: true')) && (github.event_name != 'workflow_run' || !contains(github.event.workflow_run.head_commit.message, 'Autour-Portal-Only: true')) && (github.event_name != 'workflow_run' || !contains(github.event.workflow_run.head_commit.message, 'Hikes-Guide-Only: true')) && (github.event_name != 'workflow_run' || !contains(github.event.workflow_run.head_commit.message, 'Nyons-Guide-Only: true'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Préparer et publier uniquement le portail depuis la dernière version
        run: python tools/publish_generated_pages.py immobilier

