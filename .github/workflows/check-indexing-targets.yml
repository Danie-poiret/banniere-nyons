name: Vérifier les neuf URL signalées en double
on:
  push:
    paths:
      - '**/*.html'
      - sitemap.xml
      - tools/indexing_targets.py
      - tools/normalize_indexing_targets.py
      - tools/check_indexing_targets.py
      - .github/workflows/check-indexing-targets.yml
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tools/check_indexing_targets.py
  public:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python tools/check_indexing_targets.py --live
