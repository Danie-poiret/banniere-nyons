name: Vérifier la balise Google et le menu
on:
  push:
    paths:
      - tools/check_google_analytics.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Vérifier la syntaxe du module partagé
        run: node --check assets/agenda.js
      - name: Installer le navigateur de vérification
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Vérifier la balise publique et les choix de cookies
        run: python tools/check_google_analytics.py --public
