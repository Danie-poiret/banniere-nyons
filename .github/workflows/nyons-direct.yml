name: Actualiser et vérifier Nyons en direct
on:
  push:
    paths:
      - tools/update_nyons_direct.py
      - tools/check_nyons_direct.py
      - assets/nyons-direct.js
      - assets/nyons-direct.css
      - meteo-nyons/index.html
      - .github/workflows/nyons-direct.yml
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nyons-direct
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Vérifier la syntaxe
        run: |
          node --check assets/nyons-direct.js
          python -m py_compile tools/update_nyons_direct.py tools/check_nyons_direct.py
      - name: Récupérer les données officielles partagées
        run: python tools/update_nyons_direct.py
      - name: Contrôler les dates, les ressources et les pannes
        run: python tools/check_nyons_direct.py --adapters
      - name: Installer le navigateur de vérification
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Vérifier la page et le mobile avant déploiement
        if: github.event_name != 'schedule'
        run: python tools/check_nyons_direct.py --local
      - name: Enregistrer le petit JSON partagé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nyons-direct.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les données officielles de Nyons en direct"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Préparer le site statique complet
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer le site sur son hébergement existant
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule'
        with:
          ref: main
      - name: Installer le navigateur de contrôle public
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Confirmer le bloc visible sur la page publiée
        if: github.event_name != 'schedule'
        run: python tools/check_nyons_direct.py --published
