name: Autour de Nyons — préparation et catalogue
on:
  push:
    branches: [main, 'preview/autour-nyons-*']
    paths:
      - 'a-faire-autour-de-Nyons/**'
      - 'assets/autour-nyons/**'
      - 'tools/*autour*'
      - 'tools/templates/autour-nyons.html.tpl'
      - 'sitemap.xml'
      - '.github/workflows/autour-nyons.yml'
  pull_request:
    paths:
      - 'a-faire-autour-de-Nyons/**'
      - 'assets/autour-nyons/**'
      - 'tools/*autour*'
      - 'tools/templates/autour-nyons.html.tpl'
      - '.github/workflows/autour-nyons.yml'
permissions:
  contents: read
concurrency:
  group: autour-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Génération stable, conservation et futurs articles
        run: |
          python tools/update_autour_portal.py
          python tools/update_autour_portal.py --check
          python tools/test_autour_portal.py
          test -z "$(git diff --name-only | grep -v '^a-faire-autour-de-Nyons/index.html$')"
          python tools/check_site_integrity.py
      - name: Préparer la version antérieure pour une comparaison identique
        env:
          BASE: ${{ github.event.pull_request.base.sha || '973e47e7c0137e9f327ce14203082d9f890c977d' }}
        run: |
          mkdir -p .audit-tools/before
          git show "$BASE:a-faire-autour-de-Nyons/index.html" > .audit-tools/before/index.html
          npm install --prefix .audit-tools --no-save playwright lighthouse chrome-launcher
          .audit-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Mobile, filtres, HTML sans JavaScript et performances avant/après
        run: node tools/check_autour_portal.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autour-verifications
          path: audit-output/autour/
      - name: Préparer un artefact Pages de branche sans déployer
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/autour-preview"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/autour-preview"
          cp a-faire-autour-de-Nyons/index.html "$RUNNER_TEMP/autour-preview/a-faire-autour-de-Nyons/index.html"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref != 'refs/heads/main'
        with:
          name: autour-preview-no-deploy
          path: ${{ runner.temp }}/autour-preview
  update-catalogue:
    if: github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Actualiser uniquement le portail existant
        run: |
          python tools/update_autour_portal.py
          python tools/update_autour_portal.py --check
          if ! git diff --quiet -- a-faire-autour-de-Nyons/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- a-faire-autour-de-Nyons/index.html
            git commit -m "Actualiser les sorties autour de Nyons" -m "Autour-Portal-Only: true"
            git push
          fi

