name: Compléter le SEO après génération du site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**/*.html', 'sitemap.xml', 'tools/harmonize_seo.py', 'tools/seo-policy.json', 'tools/consolidate_duplicate_urls.py', 'tools/duplicate-canonical-map.json', '.github/workflows/seo-centralise.yml']
  workflow_run:
    workflows: ['Appliquer la mise a jour VivreAnyons', 'Actualiser uniquement l’accueil de Vivre à Nyons', 'Actualiser uniquement les cartes du portail immobilier']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: seo-centralise
  cancel-in-progress: false
jobs:
  complete:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compléter uniquement les pages www du sitemap
        run: python tools/harmonize_seo.py --all --apply --stage
      - name: Vérifier la seconde exécution sans modification
        run: python tools/harmonize_seo.py --all --check
      - name: Publier uniquement les compléments techniques préparés
        run: |
          if git diff --cached --quiet; then exit 0; fi
          python tools/test_cleanup_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compléter les métadonnées SEO après génération'
          python tools/test_cleanup_guard.py
          git push origin HEAD:main
