name: Compléter le SEO après génération du site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**/*.html', 'sitemap.xml', 'tools/harmonize_seo.py', 'tools/publish_generated_pages.py', 'tools/seo-policy.json', 'tools/consolidate_duplicate_urls.py', 'tools/duplicate-canonical-map.json', '.github/workflows/seo-centralise.yml']
  workflow_run:
    workflows: ['Appliquer la mise a jour VivreAnyons', 'Actualiser uniquement l’accueil de Vivre à Nyons', 'Actualiser uniquement les cartes du portail immobilier']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: seo-centralise
  cancel-in-progress: false
jobs:
  complete:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'push' || !(contains(github.event.head_commit.message, 'Memory-Cities-Only: true') || contains(github.event.head_commit.message, 'Footer-Memory-Link-Only: true') || contains(github.event.head_commit.message, 'Markets-Guide-Only: true'))) && (github.event_name != 'workflow_run' || !(contains(github.event.workflow_run.head_commit.message, 'Memory-Cities-Only: true') || contains(github.event.workflow_run.head_commit.message, 'Footer-Memory-Link-Only: true') || contains(github.event.workflow_run.head_commit.message, 'Markets-Guide-Only: true'))) && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Autour-Portal-Only: true')) && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Hikes-Guide-Only: true')) && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Nyons-Guide-Only: true')) && (github.event_name != 'workflow_run' || !contains(github.event.workflow_run.head_commit.message, 'Autour-Portal-Only: true')) && (github.event_name != 'workflow_run' || !contains(github.event.workflow_run.head_commit.message, 'Hikes-Guide-Only: true')) && (github.event_name != 'workflow_run' || !contains(github.event.workflow_run.head_commit.message, 'Nyons-Guide-Only: true'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compléter, vérifier et publier depuis la dernière version
        run: python tools/publish_generated_pages.py seo

