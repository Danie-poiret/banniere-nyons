name: Appliquer la mise a jour VivreAnyons

on:
  push:
    paths:
      - vivreanyons-publication.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Deployer les fichiers prepares
        run: |
          unzip -o vivreanyons-publication.zip
          rm vivreanyons-publication.zip
          python tools/consolidate_venterol_urls.py
          python tools/consolidate_venterol_urls.py
          python tools/repair_legacy_urls.py
          python tools/repair_legacy_urls.py
          python tools/update_health_section.py
          python tools/update_weather_navigation.py
          python tools/update_weather_navigation.py
          python tools/update_latest_article.py
          if [ -f tools/update_google_analytics.py ]; then
            python tools/update_google_analytics.py
            python tools/update_google_analytics.py
            node --check assets/agenda.js
            node --check vivreanyons-test/assets/agenda.js
            node --check banniere-nyons/vivreanyons-test/assets/agenda.js
            if ! git diff --quiet -- assets/agenda.js vivreanyons-test/assets/agenda.js banniere-nyons/vivreanyons-test/assets/agenda.js tools/check_google_analytics.py; then
              python -m pip install --quiet playwright
              python -m playwright install chromium
              python tools/check_google_analytics.py
            fi
          fi
          python tools/update_site_seo.py
          python tools/normalize_indexing_targets.py
          python tools/check_indexing_targets.py
          python tools/check_site_integrity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publier le site Vivre a Nyons complet"
          git push
