name: Actualiser les horaires de bus à Nyons
on:
  push:
    paths:
      - tools/update_bus_schedules.py
      - tools/check_bus_schedules.py
      - tools/check_bus_schedules.cjs
      - assets/bus-nyons.js
      - assets/bus-nyons.css
      - infos-pratiques-nyons/bus-nyons/index.html
      - .github/workflows/bus-nyons.yml
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nyons-bus-schedules
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Vérifier les calendriers et les cas de panne
        run: |
          node --check assets/bus-nyons.js
          python tools/check_bus_schedules.py
          node tools/check_bus_schedules.cjs
      - name: Actualiser les horaires officiels
        run: python tools/update_bus_schedules.py
      - name: Vérifier les trajets obtenus
        run: node tools/check_bus_schedules.cjs
      - name: Enregistrer les horaires partagés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bus-nyons.json vivreanyons-test/assets/bus-nyons.json banniere-nyons/vivreanyons-test/assets/bus-nyons.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les horaires officiels des bus de Nyons"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Préparer le site complet
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier les horaires actualisés
        id: deployment
        uses: actions/deploy-pages@v4
