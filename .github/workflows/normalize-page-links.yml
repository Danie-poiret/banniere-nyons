name: Harmoniser les liens des pages avec le slash final
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/assets/agenda.js'
      - page_links.py
      - .github/workflows/normalize-page-links.yml
permissions:
  contents: write
jobs:
  normalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger uniquement les adresses des liens
        run: python3 page_links.py
      - name: Publier les liens harmonisés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z -- '*.html' 'assets/agenda.js' '**/assets/agenda.js' | xargs -0 -r git add --
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Utiliser le slash final dans les liens vers les pages"
          git pull --rebase
          git push
