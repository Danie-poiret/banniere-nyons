<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des équipements sportifs de Nyons</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>html,body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#263322;background:#fffdf8}*{box-sizing:border-box}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px}label{display:block;width:100%;font-weight:700;font-size:.95rem}select,button{font:inherit;min-height:44px;border:1px solid #738165;border-radius:6px;padding:8px;background:white;color:#263322}select{flex:1;min-width:0;width:100%}button{cursor:pointer;background:#edf2e5}#map{height:440px;width:100%;background:#eee9da}.pin{background:#fff;color:#244d31;border:2px solid #244d31;border-radius:50%;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 5px #0004}.leaflet-popup-content{font:15px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}.leaflet-popup-content h2{font-size:1.1rem;margin:0 0 8px}.leaflet-popup-content a{display:inline-block;padding:5px 0;color:#244d31}.leaflet-popup-content p{margin:8px 0}#map-note{margin:8px 12px;font-size:.88rem}.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important}*:focus-visible{outline:3px solid #b3592f;outline-offset:3px}@media(max-width:500px){#map{height:350px}select{flex-basis:100%}}</style></head><body><div class="toolbar"><label for="place">Choisis un équipement sur la carte</label><select id="place"><option value="">Les neuf équipements</option><option value="digue">1. Promenade de la Digue — repère du Jardin des Arômes</option><option value="skate">2. Skate-park de l’Eygues</option><option value="city">3. City-stade Jean-Claude Métral</option><option value="basket">4. Terrain extérieur de basketball</option><option value="maison">5. Maison des Sports Jean Monpeyssen</option><option value="tennis">6. Tennis Club de Nyons — tennis et padel</option><option value="boules">7. Pétanque place de la Libération</option><option value="laurons">8. Centre régional de boule sportive et pétanque</option><option value="stade">9. Stade Pierre Jullien</option></select><button id="all" type="button">Voir les 9 équipements</button></div><div id="map" role="region" aria-label="Carte interactive des équipements sportifs à Nyons"></div><p id="map-note" role="status">Les neuf équipements sont aussi décrits dans l’article. Les repères situent les équipements, pas les entrées ni un trajet piéton vérifié.</p><noscript><p>La carte nécessite JavaScript. Consulte les neuf équipements et les itinéraires dans l’article.</p></noscript><script src="/assets/marches-drome/leaflet.js"></script><script>
const places=[{"id": "digue", "number": 1, "name": "Promenade de la Digue — repère du Jardin des Arômes", "address": "Promenade de la Digue, Nyons", "note": "Marche et footing ; repère du jardin, pas une entrée unique de la promenade.", "lat": 44.35631, "lon": 5.13605, "site": "https://www.vivreanyons.fr/que-faire-nyons/promenade-de-la-digue-nyons/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Promenade+de+la+Digue+%E2%80%94+rep%C3%A8re+du+Jardin+des+Ar%C3%B4mes%2C+Promenade+de+la+Digue%2C+Nyons&travelmode=walking", "anchor": "sport-digue"}, {"id": "skate", "number": 2, "name": "Skate-park de l’Eygues", "address": "Promenade de la Digue, Nyons", "note": "Accès gratuit ; protections et respect des autres usagers.", "lat": 44.35790530951996, "lon": 5.1394689603577035, "site": "https://www.nyons.com/annuaire/skate-parc-de-leygues/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Skate-park+de+l%E2%80%99Eygues%2C+Promenade+de+la+Digue%2C+Nyons&travelmode=walking", "anchor": "sport-metral"}, {"id": "city", "number": 3, "name": "City-stade Jean-Claude Métral", "address": "Promenade de la Digue, Nyons", "note": "Terrain partagé et gratuit ; même repère municipal que le skate-park.", "lat": 44.35790530951996, "lon": 5.1394689603577035, "site": "https://www.nyons.com/annuaire/le-terrain-multisports-city-stade/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=City-stade+Jean-Claude+M%C3%A9tral%2C+Promenade+de+la+Digue%2C+Nyons&travelmode=walking", "anchor": "sport-metral"}, {"id": "basket", "number": 4, "name": "Terrain extérieur de basketball", "address": "Promenade de la Digue, Nyons", "note": "Terrain municipal extérieur, distinct du city-stade ; vérifier sa disponibilité.", "lat": 44.35598369922704, "lon": 5.135381273819007, "site": "https://www.nyons.com/annuaire/terrain-de-basketball-exterieur-de-la-digue/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Terrain+ext%C3%A9rieur+de+basketball%2C+Promenade+de+la+Digue%2C+Nyons&travelmode=walking", "anchor": "sport-basket"}, {"id": "maison", "number": 5, "name": "Maison des Sports Jean Monpeyssen", "address": "Allée des Sports, Nyons", "note": "Activités scolaires, clubs et créneaux organisés.", "lat": 44.35789763854627, "lon": 5.135467104507484, "site": "https://www.nyons.com/annuaire/maison-des-sports-jean-monpeyssen/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Maison+des+Sports+Jean+Monpeyssen%2C+All%C3%A9e+des+Sports%2C+Nyons&travelmode=walking", "anchor": "sport-maison"}, {"id": "tennis", "number": 6, "name": "Tennis Club de Nyons — tennis et padel", "address": "7 rue Draye de Meyne, Nyons", "note": "Réservation et conditions du club ; repère municipal de l’établissement.", "lat": 44.35886992645855, "lon": 5.140126101566352, "site": "https://www.nyons.com/annuaire/tennis-club-nyonsais/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Tennis+Club+de+Nyons+%E2%80%94+tennis+et+padel%2C+7+rue+Draye+de+Meyne%2C+Nyons&travelmode=walking", "anchor": "sport-tennis"}, {"id": "boules", "number": 7, "name": "Pétanque place de la Libération", "address": "Place de la Libération, Nyons", "note": "Espace de boules en centre-ville ; selon disponibilité.", "lat": 44.359972, "lon": 5.139421, "site": "https://www.vivreanyons.fr/infos-pratiques-nyons/petanque-nyons/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=P%C3%A9tanque+place+de+la+Lib%C3%A9ration%2C+Place+de+la+Lib%C3%A9ration%2C+Nyons&travelmode=walking", "anchor": "sport-petanque"}, {"id": "laurons", "number": 8, "name": "Centre régional de boule sportive et pétanque", "address": "125 rue Félix-Maurent, Laurons II, Nyons", "note": "Clubs et compétitions ; plus éloigné du centre.", "lat": 44.3496478691262, "lon": 5.119361063754241, "site": "https://www.nyons.com/annuaire/centre-regional-de-boule-sportive-petanque/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Centre+r%C3%A9gional+de+boule+sportive+et+p%C3%A9tanque%2C+125+rue+F%C3%A9lix-Maurent%2C+Laurons+II%2C+Nyons&travelmode=walking", "anchor": "sport-petanque"}, {"id": "stade", "number": 9, "name": "Stade Pierre Jullien", "address": "Route de Mirabel, Nyons", "note": "Football et athlétisme ; conditions d’accès à vérifier auprès des clubs.", "lat": 44.35494134742357, "lon": 5.136022946154753, "site": "https://www.nyons.com/annuaire/stade-pierre-jullien/", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Stade+Pierre+Jullien%2C+Route+de+Mirabel%2C+Nyons&travelmode=walking", "anchor": "sport-stade"}];
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=document.getElementById('map-note');
if(window.L){
 const map=L.map('map',{scrollWheelZoom:false}).setView([44.36,5.13],13);const bounds=places.map(p=>[p.lat,p.lon]);const markers=new Map();let failures=0;
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{if(++failures>2)status.textContent='Le fond de carte ne se charge pas. Les marqueurs, le choix d’équipement et les liens de l’article restent disponibles.';}).addTo(map);
 const popup=p=>'<h2>'+e(p.name)+'</h2><p>'+e(p.address)+'</p><p>'+e(p.note)+'</p><p><a href="'+e(p.site)+'" target="_blank" rel="noopener">Source du repère ↗</a><br><a href="'+e(p.route)+'" target="_blank" rel="noopener">Itinéraire à pied depuis Nyons ↗</a><br><a href="/que-faire-nyons/bouger-sans-voiture/#'+p.anchor+'" target="_parent">Lire les conditions d’accès dans l’article</a></p>';
 const groups=new Map();places.forEach(p=>{const k=p.lat+','+p.lon;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});
 groups.forEach(group=>{const p=group[0];const labels=group.map(q=>q.number).join(' · ');const label=group.map(q=>q.number+'. '+q.name).join(' / ');const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'pin',html:labels,iconSize:[group.length>1?46:30,30],iconAnchor:[group.length>1?23:15,15]}),title:label,alt:label,keyboard:true});marker.bindPopup(group.map(popup).join('<hr>'),{maxWidth:290,autoPanPadding:[18,18]}).addTo(map);marker.getElement().setAttribute('aria-label',label);group.forEach(q=>markers.set(q.id,marker));});
 map.getContainer().querySelector('.leaflet-control-zoom-in').setAttribute('aria-label','Agrandir la carte');map.getContainer().querySelector('.leaflet-control-zoom-out').setAttribute('aria-label','Réduire la carte');
 const all=()=>{map.closePopup();map.fitBounds(bounds,{padding:[24,24],maxZoom:14,animate:false});document.getElementById('place').value='';};all();
 document.getElementById('place').addEventListener('change',event=>{const p=places.find(p=>p.id===event.target.value);if(!p){all();return;}map.setView([p.lat,p.lon],16,{animate:false});markers.get(p.id).setPopupContent(popup(p)).openPopup();});
 document.getElementById('all').addEventListener('click',all);
}else status.textContent='La carte est indisponible. Les neuf équipements et les itinéraires restent disponibles dans l’article.';
</script></body></html>
