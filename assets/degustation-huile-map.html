<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des sept adresses de dégustation à Nyons</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>html,body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#263322;background:#fffdf8}*{box-sizing:border-box}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px}label{display:block;width:100%;font-weight:700;font-size:.95rem}select,button{font:inherit;min-height:44px;border:1px solid #738165;border-radius:6px;padding:8px;background:white;color:#263322}select{flex:1;min-width:0;width:100%}button{cursor:pointer;background:#edf2e5}#map{height:440px;width:100%;background:#eee9da}.pin{background:#fff;color:#244d31;border:2px solid #244d31;border-radius:50%;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 5px #0004}.leaflet-popup-content{font:15px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}.leaflet-popup-content h2{font-size:1.1rem;margin:0 0 8px}.leaflet-popup-content a{display:inline-block;padding:5px 0;color:#244d31}.leaflet-popup-content p{margin:8px 0}#map-note{margin:8px 12px;font-size:.88rem}.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important}*:focus-visible{outline:3px solid #b3592f;outline-offset:3px}@media(max-width:500px){#map{height:350px}select{flex-basis:100%}}</style></head><body><div class="toolbar"><label for="place">Choisis une adresse sur la carte</label><select id="place"><option value="">Les sept adresses</option><option value="maison">1. Maison des Huiles et Olives de France</option><option value="vignolis">2. Vignolis</option><option value="dozol">3. Moulin Dozol-Autrand</option><option value="richard">4. Huilerie Richard</option><option value="ramade">5. Moulin Ramade</option><option value="bres">6. Ferme Brès</option><option value="combes">7. Domaine Les Combes Chauves</option></select><button id="all" type="button">Voir les 7 adresses</button></div><div id="map" role="region" aria-label="Carte interactive des lieux de dégustation à Nyons"></div><p id="map-note" role="status">Les sept adresses sont aussi décrites dans l’article. Les repères ne désignent pas un parking.</p><noscript><p>La carte nécessite JavaScript. Consulte les sept adresses et les itinéraires dans l’article.</p></noscript><script src="/assets/marches-drome/leaflet.js"></script><script>
const places=[{"id": "maison", "number": 1, "name": "Maison des Huiles et Olives de France", "address": "40 place de la Libération, 26110 Nyons", "phone": "04 75 26 90 90", "site": "https://maisondeshuilesetolives.fr/ateliers/ateliers-degustations/", "note": "Exposition : 4 € adulte. Atelier : 12 €, sur réservation.", "lon": 5.140027, "lat": 44.359729, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Maison+des+Huiles+et+Olives+de+France%2C+40+place+de+la+Lib%C3%A9ration%2C+26110+Nyons&travelmode=driving"}, {"id": "vignolis", "number": 2, "name": "Vignolis", "address": "Place Olivier-de-Serres, 26110 Nyons", "phone": "04 75 26 95 09", "site": "https://www.vignolis.fr/fr/espace-vignolis/l-espace-de-degustation", "note": "Espace dégustation ; musée en visite libre gratuite.", "lon": 5.132793055555555, "lat": 44.3606825, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Vignolis%2C+Place+Olivier-de-Serres%2C+26110+Nyons&travelmode=driving"}, {"id": "dozol", "number": 3, "name": "Moulin Dozol-Autrand", "address": "Promenade de la Digue, près du Pont Roman, 26110 Nyons", "phone": "04 75 26 02 52", "site": "https://www.moulindozol.com/", "note": "Boutique et dégustation ; horaires à confirmer.", "lon": 5.143514, "lat": 44.360131, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Moulin+Dozol-Autrand%2C+Promenade+de+la+Digue%2C+pr%C3%A8s+du+Pont+Roman%2C+26110+Nyons&travelmode=driving"}, {"id": "richard", "number": 4, "name": "Huilerie Richard", "address": "69 avenue Frédéric-Mistral, 26110 Nyons", "phone": "04 75 26 47 53", "site": "https://huilerie-richard.com/boutiques/boutique-de-nyons/", "note": "Bar à huiles de la boutique du moulin, distinct de Pontias.", "lon": 5.126767, "lat": 44.35682, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Huilerie+Richard%2C+69+avenue+Fr%C3%A9d%C3%A9ric-Mistral%2C+26110+Nyons&travelmode=driving"}, {"id": "ramade", "number": 5, "name": "Moulin Ramade", "address": "7 impasse du Moulin, 26110 Nyons", "phone": "04 75 26 08 18", "site": "https://www.moulinramade.com/", "note": "Dégustation et visites selon les conditions d’accueil.", "lon": 5.133845, "lat": 44.359435, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Moulin+Ramade%2C+7+impasse+du+Moulin%2C+26110+Nyons&travelmode=driving"}, {"id": "bres", "number": 6, "name": "Ferme Brès", "address": "1295 chemin de Pied-de-Vaux, 26110 Nyons", "phone": "06 86 34 86 56", "site": "https://fermebres.fr/", "note": "Boutique à la ferme ; groupes sur réservation.", "lon": 5.133515, "lat": 44.373239, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Ferme+Br%C3%A8s%2C+1295+chemin+de+Pied-de-Vaux%2C+26110+Nyons&travelmode=driving"}, {"id": "combes", "number": 7, "name": "Domaine Les Combes Chauves", "address": "855 chemin des Crotasses, 26110 Nyons", "phone": "06 81 79 92 60", "site": "https://www.drome-cestmanature.com/fiches/earl-les-combes-chauves/", "note": "Appeler avant. Accès par la D94 et les panneaux depuis les Laurons.", "lon": 5.09917, "lat": 44.348967, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110%2C+France&destination=Domaine+Les+Combes+Chauves%2C+855+chemin+des+Crotasses%2C+26110+Nyons&travelmode=driving"}];
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=document.getElementById('map-note');
if(window.L){
 const map=L.map('map',{scrollWheelZoom:false}).setView([44.36,5.13],13);const bounds=places.map(p=>[p.lat,p.lon]);const markers=new Map();let failures=0;
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{if(++failures>2)status.textContent='Le fond de carte ne se charge pas. Les marqueurs, le choix d’adresse et les liens de l’article restent disponibles.';}).addTo(map);
 places.forEach(p=>{
  const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'pin',html:String(p.number),iconSize:[30,30],iconAnchor:[15,15]}),title:p.number+'. '+p.name,alt:p.number+'. '+p.name,keyboard:true});
  marker.bindPopup('<h2>'+e(p.name)+'</h2><p>'+e(p.address)+'</p><p>'+e(p.note)+'</p><p><a href="tel:'+p.phone.replace(/ /g,'')+'">Appeler : '+e(p.phone)+'</a><br><a href="'+e(p.site)+'" target="_blank" rel="noopener">Site officiel ↗</a><br><a href="'+e(p.route)+'" target="_blank" rel="noopener">Itinéraire depuis Nyons ↗</a><br><a href="/produits-du-terroir/degustation-huile-olive-nyons/#lieu-'+p.id+'" target="_parent">Lire la fiche dans l’article</a></p>',{maxWidth:290,autoPanPadding:[18,18]}).addTo(map);marker.getElement().setAttribute('aria-label',p.number+'. '+p.name);markers.set(p.id,marker);
 });
 map.getContainer().querySelector('.leaflet-control-zoom-in').setAttribute('aria-label','Agrandir la carte');map.getContainer().querySelector('.leaflet-control-zoom-out').setAttribute('aria-label','Réduire la carte');
 const all=()=>{map.closePopup();map.fitBounds(bounds,{padding:[24,24],maxZoom:14,animate:false});document.getElementById('place').value='';};all();
 document.getElementById('place').addEventListener('change',event=>{const p=places.find(p=>p.id===event.target.value);if(!p){all();return;}map.setView([p.lat,p.lon],16,{animate:false});markers.get(p.id).openPopup();});
 document.getElementById('all').addEventListener('click',all);
}else status.textContent='La carte est indisponible. Les sept adresses et les itinéraires restent disponibles dans l’article.';
</script></body></html>
