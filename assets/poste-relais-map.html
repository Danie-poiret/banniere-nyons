our">4. Carrefour Contact</option><option value="cent">5. Cent Mille Pattes</option><option value="weldom">6. Weldom</option></select><button id="all" type="button">Voir les adresses</button></div><div id="map" role="region" aria-label="Carte des bureaux et relais colis à Nyons"></div><p id="map-note" role="status">Les six emplacements sont aussi décrits dans l’article. Les repères ne désignent pas un parking.</p><noscript><p>La carte nécessite JavaScript. Consulte les onze lieux et les itinéraires dans l’article.</p></noscript><script src="/assets/marches-drome/leaflet.js"></script><script>

ber": 4, "name": "Carrefour Contact", "address": "11 place de la Libération, 26110 Nyons", "types": ["pickup"], "note": "Retrait pendant les horaires du commerce.", "lat": 44.3604234, "lon": 5.1383021, "site": "https://localiser.laposte.fr/drome/nyons/carrefour-contact-366800", "locator": "https://localiser.laposte.fr/drome/nyons/carrefour-contact-366800", "route": "https://www.google.com/maps/dir/?api=1&destination=44.3604234%2C5.1383021", "source": "https://www.google.com/maps/place/Carrefour+Contact/@44.3604234,5.1383021,17z/data=!3m1!4b1!4m6!3m5!1s0x12ca83fe39070bdb:0x169a2754e7c772ef!8m2!3d44.3604234!4d5.1383021!16s%2Fg%2F11xc27q4r?entry=ttu&g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D"}, {"id": "cent", "number": 5, "name": "Cent Mille Pattes", "address": "376 rue du Paroir, ZA du Grand Tilleul, 26110 Nyons", "types": ["pickup"], "note": "Retrait pendant les horaires du commerce.", "lat": 44.3469376, "lon": 5.115256, "site": "https://localiser.laposte.fr/drome/nyons/cent-milles-pattes-559168", "locator": "https://localiser.laposte.fr/drome/nyons/cent-milles-pattes-559168", "route": "https://www.google.com/maps/dir/?api=1&destination=44.3469376%2C5.115256", "source": "https://www.google.com/maps/place/Cent+Mille+Pattes+Nyons/@44.3469376,5.115256,17z/data=!3m1!4b1!4m6!3m5!1s0x12ca810150458f47:0xef31a820bfd0d0a2!8m2!3d44.3469376!4d5.115256!16s%2Fg%2F11sc3j2p08?entry=ttu&g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D"}, {"id": "weldom", "number": 6, "name": "Weldom", "address": "65 route de Montélimar, 26110 Nyons", "types": ["mondial"], "note": "Locker Mondial Relay ; vérifier le point indiqué par le transporteur.", "lat": 44.3638458, "lon": 5.1255572, "site": "https://www.weldom.fr/m/weldom-nyons", "locator": "https://www.mondialrelay.fr/", "route": "https://www.google.com/maps/dir/?api=1&destination=44.3638458%2C5.1255572", "source": "https://www.google.com/maps/place/Weldom+Nyons/@44.3638458,5.1255572,17z/data=!3m1!4b1!4m6!3m5!1s0x12ca83e123c47717:0xbda0330211926de2!8m2!3d44.3638458!4d5.1255572!16s%2Fg%2F11b6d592cn?entry=ttu&g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D"}];
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=document.getElementById('map-note');
if(window.L){
 const map=L.map('map',{scrollWheelZoom:false}).setView([44.36,5.13],13);const bounds=places.map(p=>[p.lat,p.lon]);const markers=new Map();let failures=0;
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{if(++failures>2)status.textContent='Le fond de carte ne se charge pas. Les marqueurs, le choix d’adresse et les liens de l’article restent disponibles.';}).addTo(map);
 places.forEach(p=>{

  marker.bindPopup('<h2>'+e(p.name)+'</h2><p>'+e(p.types.map(t=>({laposte:'La Poste',pickup:'Pickup',mondial:'Mondial Relay'}[t])).join(' · '))+'</p><p>'+e(p.address)+'</p><p>'+e(p.note)+'</p><p>'+(p.phone?'<a href="tel:'+p.phone.replace(/ /g,'')+'">Appeler : '+e(p.phone)+'</a><br>':'')+'<a href="'+e(p.site)+'" target="_blank" rel="noopener">Adresse officielle ↗</a><br><a href="'+e(p.locator)+'" target="_blank" rel="noopener">Vérifier le réseau et le point de retrait ↗</a><br><a href="'+e(p.route)+'" target="_blank" rel="noopener">Itinéraire vers ce point ↗</a><br><a href="/infos-pratiques-nyons/poste-relais-colis-nyons/#poste-lieu-'+p.id+'" target="_parent">Lire le repère dans l’article</a></p>',{maxWidth:Math.max(160,Math.min(290,window.innerWidth-80)),maxHeight:230,autoPanPadding:[18,18]}).addTo(map);marker.getElement().setAttribute('aria-label',p.number+'. '+p.name);markers.set(p.id,marker);
 });
 map.getContainer().querySelector('.leaflet-control-zoom-in').setAttribute('aria-label','Agrandir la carte');map.getContainer().querySelector('.leaflet-control-zoom-out').setAttribute('aria-label','Réduire la carte');
 const visiblePlaces=()=>places.filter(p=>!document.getElementById('kind').value||p.types.includes(document.getElementById('kind').value));const all=()=>{map.closePopup();const shown=visiblePlaces();places.forEach(p=>{const visible=shown.includes(p),marker=markers.get(p.id);if(visible&&!map.hasLayer(marker))marker.addTo(map);else if(!visible&&map.hasLayer(marker))map.removeLayer(marker);});map.fitBounds(shown.map(p=>[p.lat,p.lon]),{padding:[24,24],maxZoom:15,animate:false});document.getElementById('place').value='';[...document.getElementById('place').options].forEach(o=>{o.hidden=!!o.value&&!shown.some(p=>p.id===o.value);});status.textContent=shown.length+' adresse(s) affichée(s). Vérifiez les conditions auprès des établissements.';};all();document.getElementById('kind').addEventListener('change',all);
 document.getElementById('place').addEventListener('change',event=>{const p=places.find(p=>p.id===event.target.value);if(!p){all();return;}map.setView([p.lat,p.lon],16,{animate:false});markers.get(p.id).openPopup();});
 document.getElementById('all').addEventListener('click',all);
