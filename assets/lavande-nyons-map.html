<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des lavandes et visites autour de Nyons</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>html,body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#263322;background:#fffdf8}*{box-sizing:border-box}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px}label{display:block;width:100%;font-weight:700;font-size:.95rem}select,button{font:inherit;min-height:44px;border:1px solid #738165;border-radius:6px;padding:8px;background:white;color:#263322}select{flex:1;min-width:0;width:100%}button{cursor:pointer;background:#edf2e5}#map{height:440px;width:100%;background:#eee9da}.pin{background:#fff;color:#244d31;border:2px solid #244d31;border-radius:50%;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 5px #0004}.leaflet-popup-content{font:15px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}.leaflet-popup-content h2{font-size:1.1rem;margin:0 0 8px}.leaflet-popup-content a{display:inline-block;padding:5px 0;color:#244d31}.leaflet-popup-content p{margin:8px 0}#map-note{margin:8px 12px;font-size:.88rem}.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important}*:focus-visible{outline:3px solid #b3592f;outline-offset:3px}@media(max-width:500px){#map{height:350px}select{flex-basis:100%}}</style></head><body><div class="toolbar"><label for="place">Choisis une adresse sur la carte</label><select id="place"><option value="">Les cinq lieux</option><option value="bleu">1. Distillerie Bleu Provence</option><option value="jardin">2. Jardin des Arômes</option><option value="venterol">3. Venterol</option><option value="vinsobres">4. Vinsobres</option><option value="rucher">5. Rucher Vahé</option></select><button id="all" type="button">Voir les 5 lieux</button></div><div id="map" role="region" aria-label="Carte interactive des villages et visites autour de la lavande"></div><p id="map-note" role="status">Les cinq lieux sont aussi décrits dans l’article. Les repères ne désignent pas un parking.</p><noscript><p>La carte nécessite JavaScript. Consulte les cinq lieux et les itinéraires dans l’article.</p></noscript><script src="/assets/marches-drome/leaflet.js"></script><script>
const places=[{"id": "bleu", "name": "Distillerie Bleu Provence", "address": "58 promenade de la Digue, 26110 Nyons", "lat": 44.359267, "lon": 5.141215, "site": "https://distillerie-bleu-provence.com/", "note": "Horaires, ateliers et distillation en activité à vérifier avant de venir.", "number": 1, "phone": "", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C26110&destination=44.359267%2C5.141215&travelmode=walking"}, {"id": "jardin", "name": "Jardin des Arômes", "address": "Promenade de la Digue, 26110 Nyons", "lat": 44.35631, "lon": 5.13605, "site": "https://www.vivreanyons.fr/que-faire-nyons/Jardin-des-Aromes/", "note": "Jardin public de plantes aromatiques ; ce repère ne désigne pas un champ agricole.", "number": 2, "phone": "", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C26110&destination=44.35631%2C5.13605&travelmode=walking"}, {"id": "venterol", "name": "Venterol", "address": "Village de Venterol, 26110 — repère près de la mairie, 24 rue du Bout du Monde", "lat": 44.390787, "lon": 5.098118, "site": "https://www.venterol.net/", "note": "Repère du village, pas un parking ni une parcelle de lavande ouverte au public.", "number": 3, "phone": "", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C26110&destination=44.390787%2C5.098118&travelmode=driving"}, {"id": "vinsobres", "name": "Vinsobres", "address": "Village de Vinsobres, 26110 — repère du bourg", "lat": 44.331411, "lon": 5.0591, "site": "https://www.vinsobres.fr/", "note": "Repère communal, pas une localisation de champ fleuri ni un parking.", "number": 4, "phone": "", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C26110&destination=44.331411%2C5.0591&travelmode=driving"}, {"id": "rucher", "name": "Rucher Vahé", "address": "1010 route de Saint Maurice sur Eygues, 26110 Vinsobres", "lat": 44.314668, "lon": 5.052295, "phone": "06 50 90 67 48", "site": "https://www.drome-cestmanature.com/fiches/rucher-vahe/", "note": "Contacter l’exploitation avant de venir : vente directe et dégustation à confirmer.", "number": 5, "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C26110&destination=44.314668%2C5.052295&travelmode=driving"}];
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=document.getElementById('map-note');
if(window.L){
 const map=L.map('map',{scrollWheelZoom:false}).setView([44.36,5.13],13);const bounds=places.map(p=>[p.lat,p.lon]);const markers=new Map();let failures=0;
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{if(++failures>2)status.textContent='Le fond de carte ne se charge pas. Les marqueurs, le choix d’adresse et les liens de l’article restent disponibles.';}).addTo(map);
 places.forEach(p=>{
  const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'pin',html:String(p.number),iconSize:[30,30],iconAnchor:[15,15]}),title:p.number+'. '+p.name,alt:p.number+'. '+p.name,keyboard:true});
  marker.bindPopup('<h2>'+e(p.name)+'</h2><p>'+e(p.address)+'</p><p>'+e(p.note)+'</p><p>'+(p.phone?'<a href="tel:'+p.phone.replace(/ /g,'')+'">Appeler : '+e(p.phone)+'</a><br>':'')+'<a href="'+e(p.site)+'" target="_blank" rel="noopener">Informations sur le lieu ↗</a><br><a href="'+e(p.route)+'" target="_blank" rel="noopener">Itinéraire depuis Nyons ↗</a><br><a href="/produits-du-terroir/Lavande-de-Nyons/#lieu-'+p.id+'" target="_parent">Lire le repère dans l’article</a></p>',{maxWidth:290,autoPanPadding:[18,18]}).addTo(map);marker.getElement().setAttribute('aria-label',p.number+'. '+p.name);markers.set(p.id,marker);
 });
 map.getContainer().querySelector('.leaflet-control-zoom-in').setAttribute('aria-label','Agrandir la carte');map.getContainer().querySelector('.leaflet-control-zoom-out').setAttribute('aria-label','Réduire la carte');
 const all=()=>{map.closePopup();map.fitBounds(bounds,{padding:[24,24],maxZoom:14,animate:false});document.getElementById('place').value='';};all();
 document.getElementById('place').addEventListener('change',event=>{const p=places.find(p=>p.id===event.target.value);if(!p){all();return;}map.setView([p.lat,p.lon],16,{animate:false});markers.get(p.id).openPopup();});
 document.getElementById('all').addEventListener('click',all);
}else status.textContent='La carte est indisponible. Les cinq lieux et les itinéraires restent disponibles dans l’article.';
</script></body></html>
