<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des quatre distilleries de lavande</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>html,body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#263322;background:#fffdf8}*{box-sizing:border-box}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px}label{display:block;width:100%;font-weight:700;font-size:.95rem}select,button{font:inherit;min-height:44px;border:1px solid #738165;border-radius:6px;padding:8px;background:white;color:#263322}select{flex:1;min-width:0;width:100%}button{cursor:pointer;background:#edf2e5}#map{height:440px;width:100%;background:#eee9da}.pin{background:#fff;color:#244d31;border:2px solid #244d31;border-radius:50%;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 5px #0004}.leaflet-popup-content{font:15px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}.leaflet-popup-content h2{font-size:1.1rem;margin:0 0 8px}.leaflet-popup-content a{display:inline-block;padding:5px 0;color:#244d31}.leaflet-popup-content p{margin:8px 0}#map-note{margin:8px 12px;font-size:.88rem}.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important}*:focus-visible{outline:3px solid #b3592f;outline-offset:3px}@media(max-width:500px){#map{height:350px}select{flex-basis:100%}}</style></head><body><div class="toolbar"><label for="place">Choisis une adresse sur la carte</label><select id="place"><option value="">Les quatre adresses</option><option value="bleu">1. Distillerie Bleu Provence</option><option value="bouquet">2. Ho ! Bouquet de Lavande</option><option value="vallon">3. Vallon des Lavandes</option><option value="aroma">4. Aroma’Plantes</option></select><button id="all" type="button">Voir les 4 adresses</button></div><div id="map" role="region" aria-label="Carte interactive des distilleries de lavande"></div><p id="map-note" role="status">Les quatre lieux sont aussi décrits dans l’article. Les repères ne désignent pas un parking.</p><noscript><p>La carte nécessite JavaScript. Consulte les quatre lieux et les itinéraires dans l’article.</p></noscript><script src="/assets/marches-drome/leaflet.js"></script><script>
const places=[{"id": "bleu", "name": "Distillerie Bleu Provence", "address": "58 promenade de la Digue, 26110 Nyons", "lat": 44.359267, "lon": 5.141215, "site": "https://distillerie-bleu-provence.com/accueil/la-distillerie-bleu-provence/informations-pratiques/", "note": "Horaires, activité de distillation et réservation à confirmer avant la visite.", "number": 1, "phone": "04 75 26 10 42", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110&destination=44.359267%2C5.141215&travelmode=driving"}, {"id": "bouquet", "name": "Ho ! Bouquet de Lavande", "address": "450 route des Lavandes, Valla de la Pierre, 26570 Ferrassières", "lat": 44.1338049, "lon": 5.4793524, "site": "https://www.auvergnerhonealpes-tourisme.com/fiches/ho-bouquet-de-lavande/", "note": "Horaires, activité de distillation et réservation à confirmer avant la visite.", "number": 2, "phone": "06 74 61 84 28", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110&destination=44.1338049%2C5.4793524&travelmode=driving"}, {"id": "vallon", "name": "Vallon des Lavandes", "address": "965 route du Vallon, Domaine le Vallon, 84390 Sault", "lat": 44.108605, "lon": 5.410793, "site": "https://www.provenceguide.com/activites/mont-ventoux/visite-de-la-distillerie-traditionnelle-du-vallon-des-lavandes/provence-597736-1.html", "note": "Horaires, activité de distillation et réservation à confirmer avant la visite.", "number": 3, "phone": "04 90 64 14 83", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110&destination=44.108605%2C5.410793&travelmode=driving"}, {"id": "aroma", "name": "Aroma’Plantes", "address": "Route du Mont Ventoux, 84390 Sault", "lat": 44.102129, "lon": 5.397007, "site": "https://www.distillerie-aromaplantes.com/infos-pratiques/", "note": "Horaires, activité de distillation et réservation à confirmer avant la visite.", "number": 4, "phone": "04 90 64 14 73", "route": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+26110&destination=44.102129%2C5.397007&travelmode=driving"}];
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=document.getElementById('map-note');
if(window.L){
 const map=L.map('map',{scrollWheelZoom:false}).setView([44.36,5.13],13);const bounds=places.map(p=>[p.lat,p.lon]);const markers=new Map();let failures=0;
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{if(++failures>2)status.textContent='Le fond de carte ne se charge pas. Les marqueurs, le choix d’adresse et les liens de l’article restent disponibles.';}).addTo(map);
 places.forEach(p=>{
  const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'pin',html:String(p.number),iconSize:[30,30],iconAnchor:[15,15]}),title:p.number+'. '+p.name,alt:p.number+'. '+p.name,keyboard:true});
  marker.bindPopup('<h2>'+e(p.name)+'</h2><p>'+e(p.address)+'</p><p>'+e(p.note)+'</p><p>'+(p.phone?'<a href="tel:'+p.phone.replace(/ /g,'')+'">Appeler : '+e(p.phone)+'</a><br>':'')+'<a href="'+e(p.site)+'" target="_blank" rel="noopener">Informations sur le lieu ↗</a><br><a href="'+e(p.route)+'" target="_blank" rel="noopener">Itinéraire depuis Nyons ↗</a><br><a href="/a-faire-autour-de-Nyons/distilleries-de-lavande/#distil-'+p.id+'" target="_parent">Lire le repère dans l’article</a></p>',{maxWidth:Math.max(160,Math.min(290,window.innerWidth-80)),maxHeight:230,autoPanPadding:[18,18]}).addTo(map);marker.getElement().setAttribute('aria-label',p.number+'. '+p.name);markers.set(p.id,marker);
 });
 map.getContainer().querySelector('.leaflet-control-zoom-in').setAttribute('aria-label','Agrandir la carte');map.getContainer().querySelector('.leaflet-control-zoom-out').setAttribute('aria-label','Réduire la carte');
 const all=()=>{map.closePopup();map.fitBounds(bounds,{padding:[24,24],maxZoom:14,animate:false});document.getElementById('place').value='';};all();
 document.getElementById('place').addEventListener('change',event=>{const p=places.find(p=>p.id===event.target.value);if(!p){all();return;}map.setView([p.lat,p.lon],16,{animate:false});markers.get(p.id).openPopup();});
 document.getElementById('all').addEventListener('click',all);
}else status.textContent='La carte est indisponible. Les quatre lieux et les itinéraires restent disponibles dans l’article.';
</script></body></html>
