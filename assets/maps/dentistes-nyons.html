<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des cabinets dentaires cités à Nyons</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;color:#254431;background:#f8f6ec;font:14px/1.5 system-ui}header,footer{padding:10px 12px}select{width:100%;font:inherit;padding:8px}#map{height:390px}.dent-pin{border:2px solid white;border-radius:50%;background:#365b3d;color:white;text-align:center;line-height:26px;font-weight:800}footer{font-size:11px}a{color:#254b72}</style></head><body><header><label for="address"><strong>Choisir une adresse</strong></label><select id="address"><option value="">Les sept adresses</option><option value="1">1. 18 rue Pasteur</option><option value="2">2. 17 avenue Frédéric Mistral</option><option value="3">3. 8 rue Gambetta</option><option value="4">4. 16 rue Draye de Meyne</option><option value="5">5. 1 avenue Frédéric Mistral</option><option value="6">6. 21 rue Émile Lisbonne</option><option value="7">7. 35 place de la Libération</option></select></header><div id="map" role="region" aria-label="Localisation des adresses de cabinets dentaires à Nyons"></div><footer>Repères d’adresses : <a href="https://geoservices.ign.fr/services-geoplateforme-geocodage" target="_blank" rel="noopener">IGN</a>. Ces repères ne confirment ni la présence actuelle du praticien ni sa disponibilité. Appelez avant de vous déplacer.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const points=[{"n": 1, "address": "18 rue Pasteur", "lon": 5.13625, "lat": 44.359098, "practitioners": [{"name": "Dr Nasser Belhadi", "address": "18 rue Pasteur", "phone": [], "url": ["https://www.doctolib.fr/dentiste/taulignan/nasser-belhadi"], "point": 1}]}, {"n": 2, "address": "17 avenue Frédéric Mistral", "lon": 5.131541, "lat": 44.359429, "practitioners": [{"name": "Dr Jérôme Bousson", "address": "17 avenue Frédéric Mistral", "phone": ["04 75 28 11 75"], "url": ["https://www.pagesjaunes.fr/pros/60881128"], "point": 2}]}, {"n": 3, "address": "8 rue Gambetta", "lon": 5.136172, "lat": 44.360667, "practitioners": [{"name": "Dr Andrés Ceballos", "address": "8 rue Gambetta", "phone": ["04 82 32 89 09"], "url": ["https://www.pagesjaunes.fr/pros/63334096"], "point": 3}, {"name": "Dr Jean-Dominique Dufour", "address": "8 rue Gambetta", "phone": ["04 75 26 64 57"], "url": ["https://agenda.direct/rendez-vous/jean-dominique-dufour/nyons/10001138964"], "point": 3}]}, {"n": 4, "address": "16 rue Draye de Meyne", "lon": 5.140191, "lat": 44.359909, "practitioners": [{"name": "Dr Florin Cosma", "address": "16 rue Draye de Meyne", "phone": ["04 75 26 94 76"], "url": ["https://www.pagesjaunes.fr/pros/57688851"], "point": 4}, {"name": "Dr Adelin Tiberiu Stan", "address": "Résidence Le France, 16 rue Draye de Meyne", "phone": ["04 75 26 94 76"], "url": ["https://www.doctolib.fr/dentiste/nyons/adelin-stan"], "point": 4}, {"name": "Dr Oana Stan", "address": "Résidence Le France, 16 rue Draye de Meyne", "phone": ["04 75 26 94 76"], "url": ["https://www.doctolib.fr/dentiste/nyons/oana-stan"], "point": 4}]}, {"n": 5, "address": "1 avenue Frédéric Mistral", "lon": 5.132921, "lat": 44.360075, "practitioners": [{"name": "Dr Bruno Duplan", "address": "1 avenue Frédéric Mistral", "phone": ["04 75 26 07 02"], "url": ["https://www.doctolib.fr/dentiste/nyons/bruno-duplan"], "point": 5}]}, {"n": 6, "address": "21 rue Émile Lisbonne", "lon": 5.135546, "lat": 44.361243, "practitioners": [{"name": "Dr Cristina Francu", "address": "Maison de Santé, 21 rue Émile Lisbonne", "phone": ["07 67 17 50 54"], "url": ["https://www.doctolib.fr/dentiste/orange/francu-florina-cristina"], "point": 6}, {"name": "Dr Florin Parfinovici", "address": "Maison de Santé, 21 rue Émile Lisbonne", "phone": ["09 55 18 49 52"], "url": ["https://www.doctolib.fr/dentiste/bourg-les-valence/florin-parfinovici"], "point": 6}]}, {"n": 7, "address": "35 place de la Libération", "lon": 5.138876, "lat": 44.36077, "practitioners": [{"name": "Dr Christophe Gimenez", "address": "35 place de la Libération", "phone": [], "url": ["https://www.maiia.com/chirurgien-dentiste/26110-nyons/gimenez-christophe"], "point": 7}, {"name": "Dr Ionelia Verdunca", "address": "35 place de la Libération", "phone": ["04 75 26 01 74"], "url": ["https://agenda.direct/rendez-vous/ionelia-verdunca/nyons/10102040069"], "point": 7}]}];const map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const escape=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const markers=new Map();const bounds=L.latLngBounds(points.map(p=>[p.lat,p.lon]));for(const p of points){const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'dent-pin',html:String(p.n),iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);marker.bindTooltip(p.address);marker.bindPopup('<strong>'+p.n+'. '+escape(p.address)+'</strong><br>'+p.practitioners.map(c=>escape(c.name)).join('<br>')+'<br><a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.address+',26110 Nyons')+'" target="_blank" rel="noopener">Itinéraire vers cette adresse</a>');markers.set(String(p.n),marker);}map.fitBounds(bounds,{padding:[28,28],maxZoom:16});document.getElementById('address').addEventListener('change',e=>{const m=markers.get(e.target.value);if(m){map.setView(m.getLatLng(),18);m.openPopup();}else map.fitBounds(bounds,{padding:[28,28]});});</script></body></html>
