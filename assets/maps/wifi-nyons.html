<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des cafés et restaurants avec Wi-Fi à Nyons</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;color:#304c32;background:#f6f7ee}header{padding:8px;display:flex;align-items:end;gap:8px}label{flex:1}select,button{font:inherit;min-height:44px;padding:8px;border:1px solid #6d815e;border-radius:7px;background:white;color:#304c32}select{width:100%}#map{height:365px;background:#e7ecdf}#status{margin:8px;font-size:12px}.pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid #fff;border-radius:50%;background:#4d6b37;color:#fff;font-weight:bold;box-shadow:0 2px 5px #0007}.popup p{margin:6px 0}.popup a{display:block;padding:6px 0}a{color:#285632}:focus-visible{outline:3px solid #b37d27;outline-offset:3px}</style></head><body><header><label>Choisir une adresse<select id="place"><option value="">Les six adresses</option></select></label><button id="all" type="button">Tout voir</button></header><div id="map" role="region" aria-label="Six cafés et restaurants avec Wi-Fi signalé à Nyons"></div><p id="status" role="status">Chargement de la carte…</p><noscript>Les six adresses sont aussi détaillées dans l’article.</noscript><script src="/assets/marches-drome/leaflet.js"></script><script>
(()=>{'use strict';const places=[{"id": "paradisier", "name": "Le Paradisier Café", "address": "8 place Joseph Buffaven, 26110 Nyons", "lat": 44.361175, "lon": 5.140214, "note": "Wi-Fi signalé par l’office de tourisme.", "article": "/restaurants-de-nyons/paradisier-nyons/"}, {"id": "pastel", "name": "Pastel Nyons", "address": "3 rue de la Résistance, 26110 Nyons", "lat": 44.360716, "lon": 5.141122, "note": "Wi-Fi gratuit signalé sur Tripadvisor ; horaires à vérifier.", "article": "/restaurants-de-nyons/Pastel-Nyons/"}, {"id": "bistrotteur", "name": "Le Bistrotteur", "address": "8 rue de la Maladrerie, 26110 Nyons", "lat": 44.360964, "lon": 5.145515, "note": "Wi-Fi signalé dans la fiche touristique.", "article": "/restaurants-de-nyons/le-bistrotteur-nyons/"}, {"id": "pontias", "name": "Bistrot du Pontias", "address": "46 place de la Libération, 26110 Nyons", "lat": 44.360151, "lon": 5.140153, "note": "Wi-Fi signalé dans la fiche touristique.", "article": "/restaurants-de-nyons/bistro-pontias-nyons/"}, {"id": "brasserie", "name": "Brasserie de la Place", "address": "24 place de la Libération, 26110 Nyons", "lat": 44.360099, "lon": 5.138799, "note": "Wi-Fi signalé dans la fiche touristique."}, {"id": "pause", "name": "La Pause Bleu Thé", "address": "58 promenade de la Digue, 26110 Nyons", "lat": 44.359198, "lon": 5.141477, "note": "Wi-Fi annoncé sur la terrasse ; activité surtout d’avril à septembre."}],select=document.querySelector('#place'),status=document.querySelector('#status');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les adresses dans l’article.';return;}const map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.').addTo(map);const pins=new Map(),bounds=places.map(p=>[p.lat,p.lon]);function fit(){map.fitBounds(bounds,{padding:[30,30],maxZoom:16});}places.forEach((p,i)=>{const o=document.createElement('option');o.value=p.id;o.textContent=(i+1)+'. '+p.name;select.appendChild(o);const box=document.createElement('div');box.className='popup';for(const [tag,text] of [['strong',(i+1)+'. '+p.name],['p',p.address],['p',p.note]]){const e=document.createElement(tag);e.textContent=text;box.appendChild(e);}const a=document.createElement('a');a.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.name+', '+p.address);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Préparer mon itinéraire';box.appendChild(a);if(p.article){const link=document.createElement('a');link.href=p.article;link.target='_parent';link.textContent='Lire la fiche';box.appendChild(link);}const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'wifi-marker',html:'<span class="pin">'+(i+1)+'</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:p.name,alt:p.name}).bindPopup(box,{maxWidth:240,autoPanPaddingTopLeft:[12,45],autoPanPaddingBottomRight:[12,12]}).addTo(map);marker.on('click',()=>select.value=p.id);pins.set(p.id,marker);});select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),18);pin.openPopup();}else{map.closePopup();fit();}});document.querySelector('#all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});fit();document.querySelector('#map').dataset.markerCount=String(places.length);status.textContent='Six adresses avec Wi-Fi signalé. Demandez l’accord pour travailler longtemps ; prises et débit à vérifier.';})();
</script></body></html>
