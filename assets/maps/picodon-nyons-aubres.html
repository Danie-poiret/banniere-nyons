<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte du Picodon à Nyons et Aubres</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>body{margin:0;background:#f7f8ef;color:#263e2b;font:14px/1.5 system-ui}*{box-sizing:border-box}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}label{flex:1;min-width:180px}select,button{font:inherit;min-height:44px;border:1px solid #788b70;border-radius:6px;padding:8px;background:white;color:#263e2b}select{width:100%}button{cursor:pointer}#map{height:365px;background:#e4eadf}#status{margin:6px 10px;font-size:12px}a{color:#285534}.pin{background:#345c3e;border:2px solid white;border-radius:50%;box-shadow:0 2px 5px #0007;color:white;display:flex;align-items:center;justify-content:center;font:bold 14px system-ui;width:30px;height:30px}.center{background:#21699b}.popup{font:14px/1.5 system-ui}.popup p{margin:7px 0}.popup a{display:block;padding:5px 0}.leaflet-container a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #a55a28;outline-offset:2px}@media(max-width:400px){#map{height:365px}header>button{flex:1}}</style></head><body><header><label>Choisir un repère<select id="place"><option value="">Les six repères</option></select></label><button type="button" id="all">Tout voir</button><button type="button" id="center">Centre de Nyons</button></header><div id="map" role="region" aria-label="Six repères du Picodon à Nyons et Aubres"></div><p id="status" role="status">Chargement de la carte…</p><noscript>La carte nécessite JavaScript. Les adresses sont disponibles dans la liste de l’article.</noscript><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(()=>{'use strict';const places=[{"id": "marche", "name": "Marché du jeudi à Nyons", "address": "Place du Docteur-Bourdongle, 26110 Nyons — repère du marché en centre-ville", "lat": 44.3606827, "lon": 5.1410356, "anchor": "picodon-adresse-1", "number": 1, "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=Place+du+Docteur-Bourdongle%2C+26110+Nyons", "routeLabel": "Itinéraire depuis Nyons"}, {"id": "biasse", "name": "La Biasse Paysanne", "address": "1306 rue du Docteur-Dion, 26110 Nyons — repère approximatif de la rue, entrée à confirmer", "lat": 44.352768, "lon": 5.118569, "anchor": "picodon-adresse-2", "number": 2, "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=1306+rue+du+Docteur-Dion%2C+26110+Nyons", "routeLabel": "Itinéraire depuis Nyons"}, {"id": "panier", "name": "Au Panier du Coin", "address": "21 avenue Henri-Rochier, 26110 Nyons", "lat": 44.361212, "lon": 5.137833, "anchor": "picodon-adresse-3", "number": 3, "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=21+avenue+Henri-Rochier%2C+26110+Nyons", "routeLabel": "Itinéraire depuis Nyons"}, {"id": "vignolis", "name": "Vignolis", "address": "Place Olivier-de-Serres, 26110 Nyons", "lat": 44.3606825, "lon": 5.132793055555555, "anchor": "picodon-adresse-4", "number": 4, "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=Place+Olivier-de-Serres%2C+26110+Nyons", "routeLabel": "Itinéraire depuis Nyons"}, {"id": "biocoop", "name": "Biocoop Nyons Biosphere", "address": "50 rue Félix-Maurent, Les Laurons 2, 26110 Nyons", "lat": 44.3499349893987, "lon": 5.11772137651291, "anchor": "picodon-adresse-5", "number": 5, "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=50+rue+F%C3%A9lix-Maurent%2C+Les+Laurons+2%2C+26110+Nyons", "routeLabel": "Itinéraire depuis Nyons"}, {"id": "faviers", "name": "EARL des Faviers — contacter avant tout déplacement", "address": "4480 chemin du Flâchet, 26110 Aubres — repère approximatif du chemin, pas du portail ; Picodon vendu sur les marchés", "lat": 44.383492, "lon": 5.157792, "anchor": "picodon-adresse-6", "number": 6, "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=4480+chemin+du+Fl%C3%A2chet%2C+26110+Aubres", "routeLabel": "Rechercher l’adresse — rendez-vous à confirmer"}];const status=document.getElementById('status'),select=document.getElementById('place');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les six repères dans la liste de l’article.';document.querySelectorAll('button,select').forEach(el=>el.disabled=true);return;}const map=L.map('map',{scrollWheelZoom:false,zoomControl:false}),pins=new Map();L.control.zoom({position:'bottomright'}).addTo(map);const bounds=places.map(p=>[p.lat,p.lon]);const fit=()=>map.fitBounds(bounds,{padding:[25,25],maxZoom:16});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.';}).addTo(map);const base='/produits-du-terroir/picodon-fermier/';for(const p of places){const option=document.createElement('option');option.value=p.id;option.textContent=p.number+'. '+p.name;select.appendChild(option);const box=document.createElement('div');box.className='popup';const name=document.createElement('strong');name.textContent=p.number+'. '+p.name;box.appendChild(name);const address=document.createElement('p');address.textContent=p.address;box.appendChild(address);for(const [text,url,target] of [['Lire la description',base+'#'+p.anchor,'_parent'],[p.routeLabel,p.itinerary,'_blank']]){const a=document.createElement('a');a.textContent=text;a.href=url;a.target=target;a.rel='noopener noreferrer';box.appendChild(a);}const icon=L.divIcon({className:'charme-marker',html:'<span class="pin">'+p.number+'</span>',iconSize:[30,30],iconAnchor:[15,15]});const pin=L.marker([p.lat,p.lon],{icon,title:p.name,alt:p.name,keyboard:true}).bindPopup(box,{maxWidth:230}).addTo(map);pin.on('click',()=>select.value=p.id);pins.set(p.id,pin);}const town=L.marker([44.36065,5.1401],{icon:L.divIcon({className:'charme-marker',html:'<span class="pin center">N</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:'Nyons · point de départ' ,alt:'Centre de Nyons',keyboard:true}).bindPopup('Centre de Nyons · place de la Libération').addTo(map);select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),16);pin.openPopup();}else{map.closePopup();fit();}});document.getElementById('all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});document.getElementById('center').addEventListener('click',()=>{map.setView(town.getLatLng(),15);town.openPopup();});fit();document.getElementById('map').dataset.markerCount=String(places.length);status.textContent='Sélectionne une adresse. 1 à 5 : Nyons. 6 : secteur des Faviers à Aubres, visite à convenir. Repères 2 et 6 approximatifs. N : centre de Nyons.';})();
</script></body></html>
