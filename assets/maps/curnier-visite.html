<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte de Curnier : accès, village, randonnée et restaurant</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>body{margin:0;background:#f7f8ef;color:#263e2b;font:14px/1.5 system-ui}*{box-sizing:border-box}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}label{flex:1;min-width:180px}select,button{font:inherit;min-height:44px;border:1px solid #788b70;border-radius:6px;padding:8px;background:white;color:#263e2b}select{width:100%}button{cursor:pointer}#map{height:365px;background:#e4eadf}#status{margin:6px 10px;font-size:12px}a{color:#285534}.pin{background:#345c3e;border:2px solid white;border-radius:50%;box-shadow:0 2px 5px #0007;color:white;display:flex;align-items:center;justify-content:center;font:bold 14px system-ui;width:30px;height:30px}.center{background:#21699b}.popup{font:14px/1.5 system-ui}.popup p{margin:7px 0}.popup a{display:block;padding:5px 0}.leaflet-container a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #a55a28;outline-offset:2px}@media(max-width:400px){#map{height:365px}header>button{flex:1}}</style></head><body><header><label>Choisir un repère<select id="place"><option value="">Les quatre repères</option></select></label><button type="button" id="all">Tout voir</button><button type="button" id="center">Centre de Nyons</button></header><div id="map" role="region" aria-label="Centre de Curnier, aire publique, départ du Serre du Midi et Lou Cafetoun"></div><p id="status" role="status">Chargement de la carte…</p><noscript>La carte nécessite JavaScript. Les adresses sont disponibles dans le tableau de l’article.</noscript><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(()=>{'use strict';const places=[{"id": "centre", "name": "Centre du village — mairie", "address": "8 place de la Mairie ; repère pour découvrir les rues, l’église et la fontaine", "lat": 44.38528, "lon": 5.233752, "anchor": "curnier-8", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.38528,5.233752&travelmode=driving", "routeLabel": "Depuis Nyons en voiture", "number": 1}, {"id": "aire", "name": "Aire de pique-nique et jeux", "address": "Entrée du village, près de l’Eygues ; suivre les accès publics", "lat": 44.386291, "lon": 5.233505, "anchor": "curnier-10", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.386291,5.233505&travelmode=driving", "routeLabel": "Depuis Nyons en voiture", "number": 2}, {"id": "rando", "name": "Départ du Serre du Midi", "address": "Repère de départ publié par le Département ; boucle de 6,1 km et 360 m de montée", "lat": 44.386064275042, "lon": 5.2346306990016, "anchor": "curnier-11", "itinerary": "https://www.cirkwi.com/fr/circuit/267715-le-serre-du-midi", "routeLabel": "Parcours officiel du Département", "number": 3}, {"id": "cafe", "name": "Lou Cafetoun", "address": "10 place de la Mairie ; horaires et réservation à vérifier", "lat": 44.385037, "lon": 5.234455, "anchor": "curnier-12", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.385037,5.234455&travelmode=driving", "routeLabel": "Depuis Nyons en voiture", "number": 4}];const status=document.getElementById('status'),select=document.getElementById('place');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les quatre repères dans le tableau de l’article.';document.querySelectorAll('button,select').forEach(el=>el.disabled=true);return;}const map=L.map('map',{scrollWheelZoom:false,zoomControl:false}),pins=new Map();L.control.zoom({position:'bottomright'}).addTo(map);const bounds=places.map(p=>[p.lat,p.lon]);const fit=()=>map.fitBounds(bounds,{padding:[25,25],maxZoom:14});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.';}).addTo(map);const base='/a-faire-autour-de-Nyons/curnier/';for(const p of places){const option=document.createElement('option');option.value=p.id;option.textContent=p.number+'. '+p.name;select.appendChild(option);const box=document.createElement('div');box.className='popup';const name=document.createElement('strong');name.textContent=p.number+'. '+p.name;box.appendChild(name);const address=document.createElement('p');address.textContent=p.address;box.appendChild(address);for(const [text,url,target] of [['Lire la description',base+'#'+p.anchor,'_parent'],[p.routeLabel,p.itinerary,'_blank']]){const a=document.createElement('a');a.textContent=text;a.href=url;a.target=target;a.rel='noopener noreferrer';box.appendChild(a);}const icon=L.divIcon({className:'charme-marker',html:'<span class="pin">'+p.number+'</span>',iconSize:[30,30],iconAnchor:[15,15]});const pin=L.marker([p.lat,p.lon],{icon,title:p.name,alt:p.name,keyboard:true}).bindPopup(box,{maxWidth:230}).addTo(map);pin.on('click',()=>select.value=p.id);pins.set(p.id,pin);}const town=L.marker([44.36065,5.1401],{icon:L.divIcon({className:'charme-marker',html:'<span class="pin center">N</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:'Nyons · point de départ' ,alt:'Centre de Nyons',keyboard:true}).bindPopup('Centre de Nyons · place de la Libération').addTo(map);select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),16);pin.openPopup();}else{map.closePopup();fit();}});document.getElementById('all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});document.getElementById('center').addEventListener('click',()=>{map.setView(town.getLatLng(),15);town.openPopup();});fit();document.getElementById('map').dataset.markerCount=String(places.length);status.textContent='1 : centre du village. 2 : aire de pique-nique. 3 : départ du Serre du Midi. 4 : Lou Cafetoun. N : Nyons.';})();
</script></body></html>
