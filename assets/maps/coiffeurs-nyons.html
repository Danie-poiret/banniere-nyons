<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des sept salons de coiffure à Nyons</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f8f6ec;color:#254431;font:14px/1.5 system-ui}header,footer{padding:10px 12px}label{font-weight:700}select{width:100%;font:inherit;padding:8px;background:#fff;border:1px solid #8b9b80;border-radius:7px}#map{height:390px}.salon-pin{border:2px solid #fff;border-radius:50%;background:#365b3d;color:#fff;text-align:center;line-height:24px;font-weight:800;box-shadow:0 1px 4px #3339}.salon-pin.uncertain{background:#a36620}footer{font-size:11px}a{color:#254b72}</style></head><body><header><label for="salon">Choisir un salon</label><select id="salon"><option value="">Les sept salons</option><option value="un-brin-d-hair">1. Un Brin d'hair</option><option value="le-salon-de-fanny">2. Le Salon de Fanny</option><option value="noelie-coiffure">3. Noélie Coiffure</option><option value="chic-coiffure">4. Chic Coiffure</option><option value="best-barber">5. Best Barber</option><option value="changement-d-hair">6. Changement d'Hair</option><option value="r-eve-coiffure">7. R'Eve Coiffure</option></select></header><div id="map" role="region" aria-label="Localisation des sept salons de coiffure à Nyons"></div><footer>Repères d’adresses : <a href="https://geoservices.ign.fr/services-geoplateforme-geocodage" target="_blank" rel="noopener">Géoplateforme IGN</a>. Le repère orange situe uniquement la rue des Déportés pour Best Barber ; confirmez le numéro avant de partir.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const points=[{"name":"Un Brin d'hair","address":"9 avenue Henri Rochier","phone":"09 86 40 94 69","start":"Au 9 avenue Henri Rochier.","id":"un-brin-d-hair","n":1,"lon":5.138571,"lat":44.360968},{"name":"Le Salon de Fanny","address":"16 avenue Henri Rochier","phone":"04 75 26 34 20","start":"Au 16 avenue Henri Rochier.","id":"le-salon-de-fanny","n":2,"lon":5.138447,"lat":44.361155},{"name":"Noélie Coiffure","address":"16 place de la Libération","phone":"04 75 26 02 37","start":"Sur la place de la Libération.","id":"noelie-coiffure","n":3,"lon":5.138548,"lat":44.360214},{"name":"Chic Coiffure","address":"17 avenue Paul Laurens","phone":"04 75 26 25 15","start":"Au 17 avenue Paul Laurens.","id":"chic-coiffure","n":4,"lon":5.136008,"lat":44.360171},{"name":"Best Barber","address":"Rue des Déportés — 44 ou 46 à confirmer","phone":"06 58 20 07 01","start":"Rue des Déportés, dans le centre.","uncertain":true,"id":"best-barber","n":5,"lon":5.14295,"lat":44.360612},{"name":"Changement d'Hair","address":"12 rue du 4 Septembre","phone":"04 26 66 21 52","start":"Rue du 4 Septembre.","id":"changement-d-hair","n":6,"lon":5.136861,"lat":44.360677},{"name":"R'Eve Coiffure","address":"6 rue Jean-Pierre André","phone":"04 75 26 32 70","start":"Au 6 rue Jean-Pierre André.","id":"r-eve-coiffure","n":7,"lon":5.140904,"lat":44.360809}];const map=L.map("map",{scrollWheelZoom:false});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const e=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const markers=new Map(),bounds=L.latLngBounds(points.map(p=>[p.lat,p.lon]));points.forEach(p=>{const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:"salon-pin"+(p.uncertain?" uncertain":""),html:String(p.n),iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map);marker.bindTooltip(e(p.name));marker.bindPopup("<strong>"+p.n+". "+e(p.name)+"</strong><br>"+e(p.address)+"<br><a href=\"tel:+33"+p.phone.replace(/\s/g,"").slice(1)+"\">"+e(p.phone)+"</a><br><a href=\"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent((p.uncertain?"rue des Déportés":p.address)+", Nyons 26110")+"\" target=\"_blank\" rel=\"noopener\">Itinéraire</a><br><a href=\"https://www.vivreanyons.fr/infos-pratiques-nyons/coiffeurs-nyons/#"+p.id+"\" target=\"_parent\">Voir le salon dans l’article</a>");markers.set(p.id,marker);});map.fitBounds(bounds,{padding:[28,28],maxZoom:17});document.getElementById("salon").addEventListener("change",event=>{const marker=markers.get(event.target.value);if(!marker){map.fitBounds(bounds,{padding:[28,28]});return;}map.setView(marker.getLatLng(),18);marker.openPopup();});</script></body></html>
