<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les vallées du terroir de l’olive de Nyons</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>body{margin:0;font:16px system-ui;color:#293d2d}#map{height:400px}p{padding:0 15px;line-height:1.5}a{color:#285835}</style></head><body><div id="map" role="region" aria-label="Nyons et Buis-les-Baronnies"></div><p>Deux repères pour situer les vallées : <strong>Nyons — Eygues</strong> et <strong>Buis-les-Baronnies — Ouvèze</strong>. La carte ne représente pas les limites de l’appellation.</p><script src="/assets/marches-drome/leaflet.js"></script><script>if(window.L){const points=[['Nyons — vallée de l’Eygues',44.3605,5.1403],['Buis-les-Baronnies — vallée de l’Ouvèze',44.2763,5.2734]];const map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);for(const p of points)L.marker([p[1],p[2]],{title:p[0]}).bindPopup(p[0]).addTo(map);map.fitBounds(points.map(p=>[p[1],p[2]]),{padding:[45,45]});document.getElementById('map').dataset.markerCount='2';}</script></body></html>
