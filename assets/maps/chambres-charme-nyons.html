<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des 10 hébergements de charme à Nyons</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>body{margin:0;background:#f7f8ef;color:#263e2b;font:14px/1.5 system-ui}*{box-sizing:border-box}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}label{flex:1;min-width:180px}select,button{font:inherit;min-height:44px;border:1px solid #788b70;border-radius:6px;padding:8px;background:white;color:#263e2b}select{width:100%}button{cursor:pointer}#map{height:365px;background:#e4eadf}#status{margin:6px 10px;font-size:12px}a{color:#285534}.pin{background:#345c3e;border:2px solid white;border-radius:50%;box-shadow:0 2px 5px #0007;color:white;display:flex;align-items:center;justify-content:center;font:bold 14px system-ui;width:30px;height:30px}.center{background:#21699b}.popup{font:14px/1.5 system-ui}.popup p{margin:7px 0}.popup a{display:block;padding:5px 0}.leaflet-container a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #a55a28;outline-offset:2px}@media(max-width:400px){#map{height:365px}header>button{flex:1}}</style></head><body><header><label>Choisir un hébergement<select id="place"><option value="">Les 10 adresses</option></select></label><button type="button" id="all">Tout voir</button><button type="button" id="center">Centre de Nyons</button></header><div id="map" role="region" aria-label="Dix repères d’hébergements et le centre de Nyons"></div><p id="status" role="status">Chargement de la carte…</p><noscript>La carte nécessite JavaScript. Les adresses sont disponibles dans le tableau de l’article.</noscript><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(()=>{'use strict';const places=[{"id": "La-Lezardiere", "number": 1, "name": "La Lézardière", "address": "8 allée des Cigalons, 26110 Nyons", "lat": 44.364252, "lon": 5.1337, "kind": "gite", "url": "/ou-dormir-a-nyons/La-Lezardiere/", "info": "Des appartements indépendants avec terrasse, jardin et piscine, pour garder son rythme en vacances.", "warning": "", "precision": "adresse", "source": "https://www.lalezardierenyons.com/situation-contact", "anchor": "charme-1"}, {"id": "la-galiane-nyons", "number": 2, "name": "La Galiane", "address": "1064 chemin de la Mine, 26110 Nyons", "lat": 44.371655, "lon": 5.14679, "kind": "chambre", "url": "/ou-dormir-a-nyons/la-galiane-nyons/", "info": "Une maison d’hôtes avec piscine, jardin et chambres climatisées sur les hauteurs.", "warning": "", "precision": "adresse", "source": "https://www.dromeprovencale.fr/chambre-dhote/la-galiane/", "anchor": "charme-2"}, {"id": "cesar", "name": "Le Mas de César", "address": "870 route des Rieux, 26110 Nyons", "source": "https://lemasdecesar-nyons.fr/", "lat": 44.354886, "lon": 5.149709, "precision": "adresse", "number": 3, "anchor": "charme-3"}, {"id": "rouviere-nyons", "number": 4, "name": "Le Petit Rouvière", "address": "4 lotissement Le Salerand, 26110 Nyons", "lat": 44.361779, "lon": 5.124256, "kind": "gite", "url": "/ou-dormir-a-nyons/rouviere-nyons/", "info": "Des gîtes avec terrasse, bassin de nage chauffé, spa et sauna.", "warning": "", "precision": "adresse", "source": "https://www.petitrouviere.com/contact", "anchor": "charme-4"}, {"id": "villa-des-poete", "number": 5, "name": "La Villa des Poètes", "address": "531 chemin de Bellevue, 26110 Nyons", "lat": 44.34822, "lon": 5.104571, "kind": "chambre", "url": "/ou-dormir-a-nyons/villa-des-poete/", "info": "Quatre chambres côté campagne, des terrasses et une piscine extérieure en saison.", "warning": "", "precision": "adresse", "source": "https://www.lavilladespoetes.com/contact-acces/", "anchor": "charme-5"}, {"id": "clos-des-laurons-nyons", "number": 6, "name": "Le Clos des Laurons", "address": "131 avenue Frédéric Mistral, 26110 Nyons", "lat": 44.35431, "lon": 5.119387, "kind": "chambre", "url": "/ou-dormir-a-nyons/clos-des-laurons-nyons/", "info": "Des chambres d’hôtes et le gîte L’Olivier, au 131 avenue Frédéric-Mistral.", "warning": "", "precision": "adresse", "source": "https://www.leclosdeslaurons.fr/", "anchor": "charme-6"}, {"id": "antaram", "name": "La Maison d’Antaram", "address": "40 rue Camille Bréchet, 26110 Nyons", "source": "https://www.dromeprovencale.fr/chambre-dhote/la-maison-dantaram/", "lat": 44.355576, "lon": 5.131315, "precision": "adresse", "number": 7, "anchor": "charme-7"}, {"id": "benvingude", "name": "La Benvingude", "address": "15 lotissement Le Clos Lourie, 26110 Nyons", "source": "https://www.booking.com/hotel/fr/la-benvingude-nyons.fr.html", "lat": 44.357915, "lon": 5.153509, "precision": "lotissement", "number": 8, "anchor": "charme-8"}, {"id": "petit-cottage-nyons", "number": 9, "name": "Le Ptit Cottage", "address": "1005 route des Rieux, 26110 Nyons", "lat": 44.353622, "lon": 5.148593, "kind": "gite", "url": "/ou-dormir-a-nyons/petit-cottage-nyons/", "info": "Un appartement de vacances avec parking et piscine extérieure en saison.", "warning": "", "precision": "adresse", "source": "https://www.vivreanyons.fr/ou-dormir-a-nyons/petit-cottage-nyons/", "anchor": "charme-9"}, {"id": "clos-des-ruynes-nyons", "number": 10, "name": "Le Clos des Rûynes", "address": "56 avenue Paul Laurens, 26110 Nyons", "lat": 44.361025, "lon": 5.132998, "kind": "chambre", "url": "/ou-dormir-a-nyons/clos-des-ruynes-nyons/", "info": "Une maison avec jardin, petits-déjeuners bio et formule gîte avec cuisine collective.", "warning": "", "precision": "adresse", "source": "https://www.dromeprovencale.fr/chambre-dhote/le-clos-des-ruynes/", "anchor": "charme-10"}];const status=document.getElementById('status'),select=document.getElementById('place');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les dix adresses dans le tableau de l’article.';document.querySelectorAll('button,select').forEach(el=>el.disabled=true);return;}const map=L.map('map',{scrollWheelZoom:false}),pins=new Map();const bounds=places.map(p=>[p.lat,p.lon]);const fit=()=>map.fitBounds(bounds,{padding:[25,25],maxZoom:14});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.';}).addTo(map);const base='/ou-dormir-a-nyons/chambres-charmes-nyons/';for(const p of places){const option=document.createElement('option');option.value=p.id;option.textContent=p.number+'. '+p.name;select.appendChild(option);const box=document.createElement('div');box.className='popup';const name=document.createElement('strong');name.textContent=p.number+'. '+p.name;box.appendChild(name);const address=document.createElement('p');address.textContent=p.address;box.appendChild(address);if(p.precision==='lotissement'){const note=document.createElement('p');note.textContent='Repère approximatif du lotissement : demandez l’accès exact à votre hôte.';box.appendChild(note);}for(const [text,url,target] of [['Lire la description',base+'#'+p.anchor,'_parent'],['Préparer l’itinéraire','https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.name+', '+p.address),'_blank']]){const a=document.createElement('a');a.textContent=text;a.href=url;a.target=target;a.rel='noopener noreferrer';box.appendChild(a);}const icon=L.divIcon({className:'charme-marker',html:'<span class="pin">'+p.number+'</span>',iconSize:[30,30],iconAnchor:[15,15]});const pin=L.marker([p.lat,p.lon],{icon,title:p.name,alt:p.name,keyboard:true}).bindPopup(box,{maxWidth:230}).addTo(map);pin.on('click',()=>select.value=p.id);pins.set(p.id,pin);}const town=L.marker([44.36065,5.1401],{icon:L.divIcon({className:'charme-marker',html:'<span class="pin center">C</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:'Centre de Nyons · place de la Libération',alt:'Centre de Nyons',keyboard:true}).bindPopup('Centre de Nyons · place de la Libération').addTo(map);select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),16);pin.openPopup();}else{map.closePopup();fit();}});document.getElementById('all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});document.getElementById('center').addEventListener('click',()=>{map.setView(town.getLatLng(),15);town.openPopup();});fit();document.getElementById('map').dataset.markerCount=String(places.length);status.textContent='10 hébergements · repères 1 à 10. C : centre-ville. Repère 8 approximatif.';})();
</script></body></html>
