<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des guides de la lavande autour de Nyons</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#fffdf8;color:#30263b;font:15px/1.5 system-ui,sans-serif}.toolbar{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-bottom:1px solid #dfd7e5}.field{flex:1;min-width:190px}.field label{display:block;font-weight:750;margin-bottom:3px}select,button{font:inherit;min-height:44px;border:1px solid #826b93;border-radius:7px;padding:7px;background:white;color:#30263b}select{width:100%;min-width:0}button{cursor:pointer;background:#f2ecf7}#map{flex:1;min-height:0;background:#eae5dc}.map-note{flex:none;padding:7px 12px;margin:0;font-size:.81rem;line-height:1.45;border-top:1px solid #dfd7e5}.pin{border:2px solid #725094;background:#fff;color:#513569;border-radius:50%;display:grid;place-items:center;font-weight:850;box-shadow:0 1px 5px #0004}.leaflet-popup-content{font:14px/1.45 system-ui,sans-serif}.leaflet-popup-content h2{font-size:1rem;margin:0 0 8px}.leaflet-popup-content p{margin:8px 0}.leaflet-popup-content a{display:inline-block;padding:5px 0;color:#513569}.leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important}*:focus-visible{outline:3px solid #b66e33;outline-offset:3px}.map-link{font-weight:700}#drag[aria-pressed=true]{background:#725094;color:white}@media(max-width:500px){.field{min-width:100%}.toolbar{gap:6px;padding:8px}.map-note{font-size:.77rem}}
</style></head><body><div class="toolbar"><div class="field" id="route-field"><label for="circuit">Choisir le parcours</label><select id="circuit"></select></div><div class="field"><label for="etape">Choisir une étape</label><select id="etape"><option value="">Vue d’ensemble</option></select></div><button id="all" type="button">Tout voir</button><button id="drag" type="button" aria-pressed="false">Déplacer la carte</button></div><div id="map" role="region" aria-label="Carte interactive des étapes"></div><p class="map-note" id="map-status" role="status">Chargement des repères…</p><noscript><p>Les repères et liens d’itinéraire sont disponibles dans l’article, sans JavaScript.</p></noscript><script src="/assets/marches-drome/leaflet.js"></script><script>
(()=>{'use strict';const calendar=new URLSearchParams(location.search).get('guide')==='calendrier',file=calendar?'lavande-oliviers-secteurs-data.json':'route-lavande-nyons-data.json',status=document.getElementById('map-status'),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!window.L){status.textContent='La carte est indisponible. Les étapes et itinéraires restent dans l’article.';return}const map=L.map('map',{scrollWheelZoom:false,dragging:!L.Browser.mobile,touchZoom:true,keyboard:true}).setView([44.36,5.14],10),layer=L.layerGroup().addTo(map),markers=new Map();let current=null,failures=0;
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{if(++failures>2)status.textContent='Fond de carte indisponible : les repères et liens restent utilisables.'}).addTo(map);map.getContainer().querySelector('.leaflet-control-zoom-in').setAttribute('aria-label','Agrandir la carte');map.getContainer().querySelector('.leaflet-control-zoom-out').setAttribute('aria-label','Réduire la carte');
const selector=document.getElementById('circuit'),step=document.getElementById('etape'),drag=document.getElementById('drag');drag.hidden=!L.Browser.mobile;drag.addEventListener('click',()=>{const on=drag.getAttribute('aria-pressed')!=='true';drag.setAttribute('aria-pressed',String(on));on?map.dragging.enable():map.dragging.disable()});
function all(){if(!current)return;map.closePopup();map.fitBounds(current.points.map(p=>[p.lat,p.lon]),{padding:[25,25],maxZoom:13,animate:false});step.value=''}
function show(r){current=r;layer.clearLayers();markers.clear();step.replaceChildren(new Option('Vue d’ensemble',''));if(r.geometry)L.geoJSON(r.geometry,{style:{color:r.color,weight:5,opacity:.8}}).addTo(layer);const unique=[...new Map(r.points.map(p=>[p.id,p])).values()];unique.forEach((p,i)=>{const number=i+1,marker=L.marker([p.lat,p.lon],{title:number+'. '+p.name,keyboard:true,icon:L.divIcon({className:'pin',html:E(p.symbol||number),iconSize:[34,34],iconAnchor:[17,17]})}).addTo(layer);marker.bindPopup('<h2>'+E(number+'. '+p.name)+'</h2><p>'+E(p.note)+'</p><p><a href="'+E(p.route)+'" target="_blank" rel="noopener noreferrer">'+(calendar?'Préparer l’itinéraire vers la commune':'Recalculer le trajet vers cette étape')+' ↗</a>'+(p.source&&!p.source.includes('nominatim')?'<br><a href="'+E(p.source)+'" target="_blank" rel="noopener noreferrer">Informations sur ce lieu ↗</a>':'')+'</p>',{maxWidth:280});marker.getElement().setAttribute('aria-label',number+'. '+p.name);markers.set(p.id,marker);step.add(new Option(number+'. '+p.name,p.id))});status.textContent=calendar?'Repères des communes citées, pas des parcelles fleuries ni des parkings. Sur mobile, utilisez les boutons ou activez le déplacement.':'Tracé routier indicatif, calculé sur OpenStreetMap le 29/10/2026. Il ne tient pas compte des fermetures, travaux ni contraintes de gabarit. Vérifiez la RD94 avant de partir.';all()}
step.addEventListener('change',()=>{if(!step.value){all();return}const p=current.points.find(p=>p.id===step.value);map.setView([p.lat,p.lon],14,{animate:false});markers.get(p.id).openPopup()});document.getElementById('all').addEventListener('click',all);
fetch(file).then(r=>{if(!r.ok)throw Error('Données indisponibles');return r.json()}).then(data=>{data.routes.forEach(r=>selector.add(new Option(r.name,r.id)));selector.addEventListener('change',()=>show(data.routes.find(r=>r.id===selector.value)));document.getElementById('route-field').hidden=data.routes.length===1;show(data.routes[0])}).catch(()=>{status.textContent='La carte ne se charge pas. Les communes, étapes et itinéraires restent disponibles dans l’article.'});
})();</script></body></html>
