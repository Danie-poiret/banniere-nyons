<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des pique-niques à Nyons et dans les Baronnies</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>body{margin:0;background:#f7f8ef;color:#263e2b;font:14px/1.5 system-ui}*{box-sizing:border-box}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}label{flex:1;min-width:180px}select,button{font:inherit;min-height:44px;border:1px solid #788b70;border-radius:6px;padding:8px;background:white;color:#263e2b}select{width:100%}button{cursor:pointer}#map{height:365px;background:#e4eadf}#status{margin:6px 10px;font-size:12px}a{color:#285534}.pin{background:#345c3e;border:2px solid white;border-radius:50%;box-shadow:0 2px 5px #0007;color:white;display:flex;align-items:center;justify-content:center;font:bold 14px system-ui;width:30px;height:30px}.center{background:#21699b}.popup{font:14px/1.5 system-ui}.popup p{margin:7px 0}.popup a{display:block;padding:5px 0}.leaflet-container a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #a55a28;outline-offset:2px}@media(max-width:400px){#map{height:365px}header>button{flex:1}}</style></head><body><header><label>Choisir un repère<select id="place"><option value="">Les neuf repères</option></select></label><button type="button" id="all">Tout voir</button><button type="button" id="center">Centre de Nyons</button></header><div id="map" role="region" aria-label="Neuf repères pour pique-niquer à Nyons et dans les Baronnies"></div><p id="status" role="status">Chargement de la carte…</p><noscript>La carte nécessite JavaScript. Les adresses sont disponibles dans le tableau de l’article.</noscript><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" (()=>{'use strict';const places=[{"id": "digue", "name": "Promenade de la Digue", "address": "Repère d’accès près de la distillerie ; ce point ne situe pas une table", "lat": 44.359198, "lon": 5.141477, "anchor": "picnic-2", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.359198,5.141477&travelmode=walking", "routeLabel": "Itinéraire à pied depuis le centre", "source": "Plan de Nyons et adresse de la distillerie", "number": 1}, {"id": "oliviers", "name": "Sentier des Oliviers — départ", "address": "Promenade des Anglais ; la table se trouve à mi-parcours, pas au marqueur", "lat": 44.362244566598, "lon": 5.1397491767234, "anchor": "picnic-4", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.362244566598,5.1397491767234&travelmode=walking", "routeLabel": "Itinéraire à pied depuis le centre", "source": "GPX du Département et brochure municipale", "number": 2}, {"id": "col", "name": "Col de la Croix — repère", "address": "Près des Barons Perchés ; suivre la signalisation de l’aire publique, équipements du parc privé distincts", "lat": 44.346574, "lon": 5.163841, "anchor": "picnic-5", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.346574,5.163841&travelmode=driving", "routeLabel": "Préparer le trajet depuis Nyons", "source": "La Drôme Tourisme — repère du col", "number": 3}, {"id": "curnier", "name": "Aire de Curnier", "address": "Entrée du village, près des jeux et de l’Eygues", "lat": 44.386291, "lon": 5.233505, "anchor": "picnic-6", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.386291,5.233505&travelmode=driving", "routeLabel": "Préparer le trajet depuis Nyons", "source": "La Drôme Tourisme — aire de Curnier", "number": 4}, {"id": "sahune", "name": "Aire de Sahune", "address": "Bord de l’Eygues ; une table, bancs et WC à proximité selon la fiche touristique", "lat": 44.413642, "lon": 5.267334, "an jet depuis Nyons", "source": "Office de tourisme — fiche Provence-Alpes-Côte d’Azur Tourisme", "number": 9}];const status=document.getElementById('status'),select=document.getElementById('place');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les neuf repères dans le tableau de l’article.';document.querySelectorAll('button,select').forEach(el=>el.disabled=true);return;}const map=L.map('map',{scrollWheelZoom:false,zoomControl:false}),pins=new Map();L.control.zoom({position:'bottomright'}).addTo(map);const bounds=places.map(p=>[p.lat,p.lon]);const fit=()=>map.fitBounds(bounds,{padding:[25,25],maxZoom:14});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.';}).addTo(map);const base='/infos-pratiques-nyons/Pique-nique-autour-de-Nyons/';for(const p of places){const option=document.createElement('option');option.value=p.id;option.textContent=p.number+'. '+p.name;select.appendChild(option);const box=document.createElement('div');box.className='popup';const name=document.createElement('strong');name.textContent=p.number+'. '+p.name;box.appendChild(name);const address=document.createElement('p');address.textContent=p.address;box.appendChild(address);for(const [text,url,target] of [['Lire la description',base+'#'+p.anchor,'_parent'],[p.routeLabel,p.itinerary,'_blank']]){const a=document.createElement('a');a.textContent=text;a.href=url;a.target=target;a.rel='noopener noreferrer';box.appendChild(a);}const icon=L.divIcon({className:'charme-marker',html:'<span class="pin">'+p.number+'</span>',iconSize:[30,30],iconAnchor:[15,15]});const pin=L.marker([p.lat,p.lon],{icon,title:p.name,alt:p.name,keyboard:true}).bindPopup(box,{maxWidth:230}).addTo(map);pin.on('click',()=>select.value=p.id);pins.set(p.id,pin);}const town=L.marker([44.36065,5.1401],{icon:L.divIcon({className:'charme-marker',html:'<span class="pin center">N</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:'Nyons · point de départ' ,alt:'Centre de Nyons',keyboard:true}).bindPopup('Centre de Nyons · place de la Libération').addTo(map);select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),16);pin.openPopup();}else{map.closePopup();fit();}});document.getElementById('all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});document.getElementById('center').addEventListener('click',()=>{map.setView(town.getLatLng(),15);town.openPopup();});fit();document.getElementById('map').dataset.markerCount=String(places.length);status.textContent='Choisissez un repère pour lire ses précisions et préparer le trajet. Les marqueurs ne garantissent pas une table libre. N : centre de Nyons.';})();
