<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte pour visiter Sahune</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>body{margin:0;background:#f7f8ef;color:#263e2b;font:14px/1.5 system-ui}*{box-sizing:border-box}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}label{flex:1;min-width:180px}select,button{font:inherit;min-height:44px;border:1px solid #788b70;border-radius:6px;padding:8px;background:white;color:#263e2b}select{width:100%}button{cursor:pointer}#map{height:365px;background:#e4eadf}#status{margin:6px 10px;font-size:12px}a{color:#285534}.pin{background:#345c3e;border:2px solid white;border-radius:50%;box-shadow:0 2px 5px #0007;color:white;display:flex;align-items:center;justify-content:center;font:bold 14px system-ui;width:30px;height:30px}.center{background:#21699b}.popup{font:14px/1.5 system-ui}.popup p{margin:7px 0}.popup a{display:block;padding:5px 0}.leaflet-container a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #a55a28;outline-offset:2px}@media(max-width:400px){#map{height:365px}header>button{flex:1}}</style></head><body><header><label>Choisir un repère<select id="place"><option value="">Les six repères</option></select></label><button type="button" id="all">Tout voir</button><button type="button" id="center">Centre de Nyons</button></header><div id="map" role="region" aria-label="Vieux Sahune, bourg, randonnées et adresses utiles"></div><p id="status" role="status">Chargement de la carte…</p><noscript>La carte nécessite JavaScript. Les adresses sont disponibles dans le tableau de l’article.</noscript><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(()=>{'use strict';const places=[{"id": "parking-vieux", "name": "Parking du Vieux Sahune", "address": "Départ de la boucle botanique, accès par la D205 puis la route du Vieux Village", "lat": 44.409106781512584, "lon": 5.268059268431336, "anchor": "sahune-9", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.409106781512584,5.268059268431336&travelmode=driving", "routeLabel": "Depuis Nyons en voiture", "number": 1}, {"id": "vieux", "name": "Entrée du Vieux Sahune", "address": "Repère de la porte de Curnier ; suivre les chemins publics, le château est privé", "lat": 44.40951331868875, "lon": 5.269746761064383, "anchor": "sahune-2", "itinerary": "https://www.cheminsdesparcs.fr/fr/trek/133708-SAHUNE---Le-sentier-botanique", "routeLabel": "Parcours botanique officiel", "number": 2}, {"id": "bourg", "name": "Parking de la mairie", "address": "Dans le bourg, départ distinct du circuit Marcel et Devès (5,7 km)", "lat": 44.41468461228723, "lon": 5.265975130150077, "anchor": "sahune-12", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.41468461228723,5.265975130150077&travelmode=driving", "routeLabel": "Depuis Nyons vers le bourg", "number": 3}, {"id": "parc", "name": "Maison du Parc", "address": "575 route de Nyons, Sahune — entrée libre aux horaires saisonniers", "lat": 44.411896, "lon": 5.2605, "anchor": "sahune-13", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.411896,5.2605&travelmode=driving", "routeLabel": "Depuis Nyons en voiture", "number": 4}, {"id": "forge", "name": "La Forge chez Brigitte", "address": "219 route du Village, Sahune — ouverture et réservation à vérifier", "lat": 44.414, "lon": 5.2666, "anchor": "sahune-14", "itinerary": "https://www.google.com/maps/dir/?api=1&origin=Nyons%2C+France&destination=44.414,5.2666&travelmode=driving", "routeLabel": "Depuis Nyons en voiture", "number": 5}, {"id": "bramard", "name": "Point de vue sur le Rocher de Bramard", "address": "Repère du circuit Marcel et Devès ; ce point ne représente pas le sommet du rocher", "lat": 44.42139831103285, "lon": 5.27140868962152, "anchor": "sahune-12", "itinerary": "https://www.cheminsdesparcs.fr/fr/trek/94753-SAHUNE---Marcel-et-Deves", "routeLabel": "Parcours de randonnée officiel", "number": 6}];const status=document.getElementById('status'),select=document.getElementById('place');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les quatre repères dans le tableau de l’article.';document.querySelectorAll('button,select').forEach(el=>el.disabled=true);return;}const map=L.map('map',{scrollWheelZoom:false,zoomControl:false}),pins=new Map();L.control.zoom({position:'bottomright'}).addTo(map);const bounds=places.map(p=>[p.lat,p.lon]);const fit=()=>map.fitBounds(bounds,{padding:[25,25],maxZoom:14});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.';}).addTo(map);const base='/a-faire-autour-de-Nyons/sahune/';for(const p of places){const option=document.createElement('option');option.value=p.id;option.textContent=p.number+'. '+p.name;select.appendChild(option);const box=document.createElement('div');box.className='popup';const name=document.createElement('strong');name.textContent=p.number+'. '+p.name;box.appendChild(name);const address=document.createElement('p');address.textContent=p.address;box.appendChild(address);for(const [text,url,target] of [['Lire la description',base+'#'+p.anchor,'_parent'],[p.routeLabel,p.itinerary,'_blank']]){const a=document.createElement('a');a.textContent=text;a.href=url;a.target=target;a.rel='noopener noreferrer';box.appendChild(a);}const icon=L.divIcon({className:'charme-marker',html:'<span class="pin">'+p.number+'</span>',iconSize:[30,30],iconAnchor:[15,15]});const pin=L.marker([p.lat,p.lon],{icon,title:p.name,alt:p.name,keyboard:true}).bindPopup(box,{maxWidth:230}).addTo(map);pin.on('click',()=>select.value=p.id);pins.set(p.id,pin);}const town=L.marker([44.36065,5.1401],{icon:L.divIcon({className:'charme-marker',html:'<span class="pin center">N</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:'Nyons · point de départ' ,alt:'Centre de Nyons',keyboard:true}).bindPopup('Centre de Nyons · place de la Libération').addTo(map);select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),16);pin.openPopup();}else{map.closePopup();fit();}});document.getElementById('all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});document.getElementById('center').addEventListener('click',()=>{map.setView(town.getLatLng(),15);town.openPopup();});fit();document.getElementById('map').dataset.markerCount=String(places.length);status.textContent='1 : parking du Vieux Sahune. 2 : vieux village. 3 : parking du bourg. 4 : Maison du Parc. 5 : La Forge. 6 : point de vue. N : Nyons.';})();
</script></body></html>
