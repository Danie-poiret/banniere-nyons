<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte du miel et de la lavande à Nyons</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>body{margin:0;background:#f7f8ef;color:#263e2b;font:14px/1.5 system-ui}*{box-sizing:border-box}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}label{flex:1;min-width:180px}select,button{font:inherit;min-height:44px;border:1px solid #788b70;border-radius:6px;padding:8px;background:white;color:#263e2b}select{width:100%}button{cursor:pointer}#map{height:365px;background:#e4eadf}#status{margin:6px 10px;font-size:12px}a{color:#285534}.pin{background:#345c3e;border:2px solid white;border-radius:50%;box-shadow:0 2px 5px #0007;color:white;display:flex;align-items:center;justify-content:center;font:bold 14px system-ui;width:30px;height:30px}.shop{background:#975b28}.lavender{background:#785397}.center{background:#21699b}.popup{font:14px/1.5 system-ui}.popup p{margin:7px 0}.popup a{display:block;padding:5px 0}.leaflet-container a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #a55a28;outline-offset:2px}@media(max-width:400px){#map{height:365px}header>button{flex:1}}</style></head><body><header><label>Choisir une adresse<select id="place"><option value="">Les 7 adresses</option></select></label><button type="button" id="all">Tout voir</button><button type="button" id="center">Centre de Nyons</button></header><div id="map" role="region" aria-label="Sept adresses de producteurs, boutiques et découverte de la lavande"></div><p id="status" role="status">Chargement de la carte…</p><noscript>La carte nécessite JavaScript. Les adresses sont disponibles dans le tableau de l’article.</noscript><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(()=>{'use strict';const places=[{"id": "serre", "name": "Le Miel du Serre Paulet", "address": "223 chemin du Canal, 26110 Nyons", "lat": 44.366246, "lon": 5.151977, "number": 1, "anchor": "miel-adresse-1", "kind": "Producteur"}, {"id": "ramade", "name": "Moulin Ramade", "address": "7 impasse du Moulin, 26110 Nyons", "lat": 44.359435, "lon": 5.133845, "number": 2, "anchor": "miel-adresse-2", "kind": "Boutique"}, {"id": "rocheville", "name": "Domaine Rocheville", "address": "117 route de Montélimar, 26110 Nyons", "lat": 44.368694, "lon": 5.118372, "number": 3, "anchor": "miel-adresse-3", "kind": "Boutique"}, {"id": "vahe", "name": "Rucher Vahé", "address": "1010 route de Saint-Maurice-sur-Eygues, 26110 Vinsobres", "lat": 44.314681, "lon": 5.052461, "number": 4, "anchor": "miel-adresse-4", "kind": "Producteur"}, {"id": "biocoop", "name": "Biocoop Nyons Biosphère", "address": "50 rue Félix Maurent, 26110 Nyons", "lat": 44.349995, "lon": 5.117712, "number": 5, "anchor": "miel-adresse-5", "kind": "Boutique"}, {"id": "richard", "name": "Huilerie Richard", "address": "69 avenue Frédéric-Mistral, 26110 Nyons", "lat": 44.35682, "lon": 5.126767, "number": 6, "anchor": "miel-adresse-6", "kind": "Boutique"}, {"id": "bleu", "name": "Distillerie Bleu Provence", "address": "58 promenade de la Digue, 26110 Nyons", "lat": 44.359198, "lon": 5.141477, "number": 7, "anchor": "miel-adresse-7", "kind": "Découverte de la lavande"}];const status=document.getElementById('status'),select=document.getElementById('place');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les sept adresses dans le tableau de l’article.';document.querySelectorAll('button,select').forEach(el=>el.disabled=true);return;}const map=L.map('map',{scrollWheelZoom:false}),pins=new Map();const bounds=places.map(p=>[p.lat,p.lon]);const fit=()=>map.fitBounds(bounds,{padding:[25,25],maxZoom:14});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>{status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.';}).addTo(map);const base='/produits-du-terroir/miel-de-lavande-de-Nyons/';for(const p of places){const option=document.createElement('option');option.value=p.id;option.textContent=p.number+'. '+p.name;select.appendChild(option);const box=document.createElement('div');box.className='popup';const name=document.createElement('strong');name.textContent=p.number+'. '+p.name;box.appendChild(name);const address=document.createElement('p');address.textContent=p.kind+' · '+p.address;box.appendChild(address);for(const [text,url,target] of [['Lire la description',base+'#'+p.anchor,'_parent'],['Préparer l’itinéraire','https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.name+', '+p.address),'_blank']]){const a=document.createElement('a');a.textContent=text;a.href=url;a.target=target;a.rel='noopener noreferrer';box.appendChild(a);}const icon=L.divIcon({className:'charme-marker',html:'<span class="pin '+(p.kind==='Producteur'?'producer':p.kind==='Boutique'?'shop':'lavender')+'">'+p.number+'</span>',iconSize:[30,30],iconAnchor:[15,15]});const pin=L.marker([p.lat,p.lon],{icon,title:p.name,alt:p.name,keyboard:true}).bindPopup(box,{maxWidth:230}).addTo(map);pin.on('click',()=>select.value=p.id);pins.set(p.id,pin);}const town=L.marker([44.36065,5.1401],{icon:L.divIcon({className:'charme-marker',html:'<span class="pin center">C</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:'Centre de Nyons · place de la Libération',alt:'Centre de Nyons',keyboard:true}).bindPopup('Centre de Nyons · place de la Libération').addTo(map);select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),16);pin.openPopup();}else{map.closePopup();fit();}});document.getElementById('all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});document.getElementById('center').addEventListener('click',()=>{map.setView(town.getLatLng(),15);town.openPopup();});fit();document.getElementById('map').dataset.markerCount=String(places.length);status.textContent='1 à 7 : adresses. Vert : producteurs ; brun : boutiques ; violet : lavande. C : centre-ville.';})();
</script></body></html>
