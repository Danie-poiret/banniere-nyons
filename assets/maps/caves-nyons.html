<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Carte des caves et producteurs autour de Nyons</title><link rel="stylesheet" href="/assets/marches-drome/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;color:#304c32;background:#f6f7ee}header{padding:8px;display:flex;align-items:end;gap:8px}label{flex:1}select,button{font:inherit;min-height:44px;padding:8px;border:1px solid #6d815e;border-radius:7px;background:white;color:#304c32}select{width:100%}#map{height:365px;background:#e7ecdf}#status{margin:8px;font-size:12px}.pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid #fff;border-radius:50%;background:#4d6b37;color:#fff;font-weight:bold;box-shadow:0 2px 5px #0007}.popup p{margin:6px 0}.popup a{display:block;padding:6px 0}a{color:#285632}:focus-visible{outline:3px solid #b37d27;outline-offset:3px}</style></head><body><header><label>Choisir une adresse<select id="place"><option value="">Les dix adresses</option></select></label><button id="all" type="button">Tout voir</button></header><div id="map" role="region" aria-label="Les dix caves et domaines autour de Nyons"></div><p id="status" role="status">Chargement de la carte…</p><noscript>Les dix adresses sont aussi détaillées dans l’article.</noscript><script src="/assets/marches-drome/leaflet.js"></script><script>
(()=>{'use strict';const places=[{"id": "cave-1", "name": "Le vin est une fête", "address": "22 Pl. Frédéric Autiero, 26110 Nyons, France", "note": "Caviste indépendant, environ 330 références, petite terrasse", "lat": 44.360418, "lon": 5.141716}, {"id": "cave-2", "name": "Coopérative du Nyonsais Vignolis", "address": "Place Olivier de Serres, 26110 Nyons, France", "note": "Coopérative, vins et spécialités locales", "lat": 44.360695, "lon": 5.13265, "article": "/que-faire-nyons/Vignolis-Nyons/"}, {"id": "cave-3", "name": "Domaine Rocheville", "address": "117 ter Route de Montélimar, RD538, 26110 Nyons, France", "note": "Vins, olives, découverte du vignoble", "lat": 44.368594, "lon": 5.117852}, {"id": "cave-4", "name": "Domaine Autrand - Vinsobres", "address": "1605 Rte de Nyons, 26110 Vinsobres, France", "note": "Domaine familial, dégustations et animations saisonnières", "lat": 44.328169, "lon": 5.078416}, {"id": "cave-5", "name": "Domaine Jaume", "address": "24 Rue Reynarde, 26110 Vinsobres, France", "note": "Domaine familial depuis 1905, AOC Vinsobres", "lat": 44.332463, "lon": 5.059711}, {"id": "cave-6", "name": "Cave coopérative La Vinsobraise", "address": "1200 Rte de la Cave, 26110 Vinsobres, France", "note": "Grande cave coopérative de Vinsobres", "lat": 44.321664, "lon": 5.061675}, {"id": "cave-7", "name": "Domaine du moulin famille Vinson", "address": "1265 Mnt du Moulin, 26110 Vinsobres, France", "note": "Vente directe chez la famille Vinson", "lat": 44.324895, "lon": 5.070206}, {"id": "cave-8", "name": "Domaine des Arches", "address": "1711 route de Nyons, Mirabel-aux-Baronnies", "note": "Vins, huile d'olive AOP et fruits, vente directe", "lat": 44.327219, "lon": 5.101918}, {"id": "cave-9", "name": "Les Vignerons de Valléon", "address": "1 Rte de Nyons, 26770 Saint-Pantaléon-les-Vignes, France", "note": "Coopérative et vins de plusieurs appellations", "lat": 44.395474, "lon": 5.039833}, {"id": "cave-10", "name": "Domaine Giniès", "address": "Le Haut Lauzon, Piégon", "note": "Domaine biologique, dégustation et visite sur rendez-vous", "lat": 44.2992, "lon": 5.14224}],select=document.querySelector('#place'),status=document.querySelector('#status');if(!window.L){status.textContent='La carte est indisponible. Retrouvez les adresses dans l’article.';return;}const map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).on('tileerror',()=>status.textContent='Fond de carte indisponible ; les repères et les adresses restent consultables.').addTo(map);const pins=new Map(),bounds=places.map(p=>[p.lat,p.lon]);function fit(){map.fitBounds(bounds,{padding:[30,30],maxZoom:16});}places.forEach((p,i)=>{const o=document.createElement('option');o.value=p.id;o.textContent=(i+1)+'. '+p.name;select.appendChild(o);const box=document.createElement('div');box.className='popup';for(const [tag,text] of [['strong',(i+1)+'. '+p.name],['p',p.address],['p',p.note]]){const e=document.createElement(tag);e.textContent=text;box.appendChild(e);}const a=document.createElement('a');a.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.name+', '+p.address);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Préparer mon itinéraire';box.appendChild(a);if(p.article){const link=document.createElement('a');link.href=p.article;link.target='_parent';link.textContent='Lire la fiche';box.appendChild(link);}const marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'wifi-marker',html:'<span class="pin">'+(i+1)+'</span>',iconSize:[30,30],iconAnchor:[15,15]}),title:p.name,alt:p.name}).bindPopup(box,{maxWidth:240,autoPanPaddingTopLeft:[12,45],autoPanPaddingBottomRight:[12,12]}).addTo(map);marker.on('click',()=>select.value=p.id);pins.set(p.id,marker);});select.addEventListener('change',()=>{const pin=pins.get(select.value);if(pin){map.setView(pin.getLatLng(),18);pin.openPopup();}else{map.closePopup();fit();}});document.querySelector('#all').addEventListener('click',()=>{select.value='';map.closePopup();fit();});fit();document.querySelector('#map').dataset.markerCount=String(places.length);status.textContent='Dix caves et domaines. Choisissez une adresse pour afficher ses détails et préparer votre itinéraire.';})();
</script></body></html>
